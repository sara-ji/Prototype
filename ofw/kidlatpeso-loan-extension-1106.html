<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OFW 延期原型 · 不换标（11/03 会议定稿）</title>
<style>
  :root {
    --primary: #0b3aa4;
    --primary-soft: #dfe7fb;
    --ink: #1c1f2a;
    --muted: #8a8f9c;
    --line: #eceef3;
    --yellow: #f0b400;
    --red: #e5484d;
    --green: #1f9d55;
    --t-green: #8fe3b5;
    --t-yellow: #ffd84d;
    --t-red: #f7a1a1;
    --t-gray: #e3e5ea;
    --t-blue: #dfe7fb;
    --side: #f4f5f8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: #e9ebf1; }
  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }

  .side { background: var(--side); border-right: 1px solid #dde0e7; padding: 18px 14px; overflow-y: auto; }
  .brand { font-weight: 700; font-size: 16px; }
  .mode { margin: 8px 0 4px; display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; background: #e3f5ea; color: #145c38; }
  .gt { font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 650; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid #d5d9e2; background: #fff; border-radius: 8px; padding: 5px 8px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .seg button.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .plist a { display: block; padding: 7px 10px; border-radius: 8px; font-size: 13px; color: var(--ink); text-decoration: none; cursor: pointer; }
  .plist a:hover { background: #e7e9f0; }
  .plist a.on { background: #fff; font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .plist .grp { font-size: 11px; color: var(--muted); margin: 10px 10px 2px; }
  .reset { margin-top: 14px; width: 100%; border: 1px dashed #b9bfcc; background: transparent; border-radius: 8px; padding: 7px; cursor: pointer; font-size: 12px; }

  .stage { display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px; }
  .phone { width: 375px; height: 812px; border-radius: 36px; background: #000; padding: 10px; box-shadow: 0 20px 40px rgba(20,30,60,.18); }
  .screen { width: 100%; height: 100%; border-radius: 28px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #f4f4f6; }
  .screen.grad { background: linear-gradient(180deg, #dfe3fb 0%, #f3f1fb 180px, #f4f4f6 320px); }
  .sbar { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 12px; font-weight: 600; }
  .hdr { height: 48px; display: grid; grid-template-columns: 56px 1fr 72px; align-items: center; }
  .hdr .back { font-size: 26px; padding-left: 18px; cursor: pointer; color: #333; line-height: 1; }
  .hdr .title { text-align: center; font-size: 18px; }
  .hdr .right { text-align: right; padding-right: 16px; color: var(--primary); font-size: 14px; cursor: pointer; }
  .body { flex: 1; overflow-y: auto; padding: 4px 14px 16px; }
  .foot { padding: 12px 16px 22px; }
  .foot.white { background: #fff; border-top: 1px solid var(--line); }

  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; position: relative; }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 7px 0; gap: 10px; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 600; text-align: right; }
  .hr { height: 1px; background: var(--line); margin: 8px 0; }
  .big { font-size: 32px; font-weight: 700; margin: 2px 0 6px; letter-spacing: -.5px; }
  .lbl { font-size: 13px; color: #555b68; }
  .sub { font-size: 12px; color: var(--muted); }
  .sec { font-size: 16px; font-weight: 650; margin: 16px 2px 10px; }
  .red { color: var(--red); }

  .tg { display: inline-block; font-size: 11px; padding: 3px 10px; font-weight: 600; }
  .tg.green { background: var(--t-green); color: #145c38; }
  .tg.yellow { background: var(--t-yellow); color: #5a4300; }
  .tg.red { background: var(--t-red); color: #8a1c1c; }
  .tg.gray { background: var(--t-gray); color: #555b68; }
  .tg.blue { background: var(--t-blue); color: var(--primary); }
  .tg.tr { position: absolute; top: 0; right: 0; border-radius: 0 12px 0 12px; }
  .tg.tl { border-radius: 0 999px 999px 0; }
  .tg.pill { border-radius: 999px; padding: 2px 8px; }

  .billhdr { background: #fff; }
  .billhdr .t { text-align: center; font-size: 18px; padding: 10px 0 12px; }
  .tabs { display: flex; }
  .tabs div { flex: 1; text-align: center; font-size: 15px; font-weight: 650; padding: 8px 0 10px; cursor: pointer; color: var(--ink); }
  .tabs div.on { color: var(--primary); position: relative; }
  .tabs div.on::after { content: ''; position: absolute; left: 34%; right: 34%; bottom: 0; height: 2px; background: var(--primary); }
  .bcard { background: #fff; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .bcard .top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line); }
  .bcard .top .dt { font-size: 13px; cursor: pointer; }
  .bcard .in { padding: 12px 16px; }
  .amtrow { display: flex; justify-content: space-between; align-items: center; }
  .btn-sm { background: var(--primary); color: #fff; border: 0; border-radius: 8px; padding: 9px 26px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-sm:disabled { background: #c9cdd8; cursor: not-allowed; }
  .exrow { display: flex; align-items: center; gap: 8px; background: #f2f5ff; border-radius: 10px; padding: 10px 12px; margin-top: 8px; cursor: pointer; }
  .exrow .tx { flex: 1; font-size: 13px; }
  .exrow .tx b { color: var(--primary); }
  .fold { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; padding: 10px 0 2px; cursor: pointer; border-top: 1px solid var(--line); margin-top: 6px; }
  .tabbar { display: flex; background: #fff; border-top: 1px solid var(--line); padding: 8px 0 18px; }
  .tabbar div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
  .tabbar div .i { font-size: 20px; display: block; }
  .tabbar div.on { color: var(--primary); font-weight: 650; }

  .entry { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid #cdd8f6; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; cursor: pointer; }
  .entry .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--primary-soft); display: grid; place-items: center; font-size: 17px; }
  .entry .tx { flex: 1; }
  .entry .tx b { display: block; font-size: 14px; }
  .entry .tx span { font-size: 12px; color: var(--muted); }
  .chev { color: #aab; font-size: 20px; }

  .tl .it { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; padding: 9px 0; position: relative; }
  .tl .it:not(:last-child)::before { content: ''; position: absolute; left: 6px; top: 22px; bottom: -2px; width: 0; border-left: 1.5px dashed #d5d8e0; }
  .tl .dot { width: 10px; height: 10px; border-radius: 50%; background: #c9ccd6; margin-top: 5px; border: 2px solid #fff; box-shadow: 0 0 0 1.5px #c9ccd6; z-index: 1; }
  .tl .dot.cur { background: var(--primary); box-shadow: 0 0 0 1.5px var(--primary); }
  .tl .d { font-size: 15px; font-weight: 650; }
  .tl .n { font-size: 11px; color: var(--muted); }
  .tl .a { text-align: right; font-size: 15px; font-weight: 700; }
  .tl .s { font-size: 11px; color: var(--muted); text-align: right; }
  .s.overdue { color: var(--red); }
  .s.current { color: var(--yellow); }
  .s.blue { color: var(--primary); }
  .old { text-decoration: line-through; color: #b0b4bf; font-weight: 500; font-size: 12px; margin-right: 4px; }

  .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .opt { background: #fff; border: 1.5px solid #d6def3; border-radius: 12px; padding: 9px 0; text-align: center; cursor: pointer; }
  .opt .w { font-size: 11px; color: var(--muted); }
  .opt .dd { font-size: 15px; font-weight: 700; margin: 2px 0; }
  .opt.on { background: var(--primary); border-color: var(--primary); }
  .opt.on .w, .opt.on .dd { color: #fff; }
  .res { border: 1.5px solid #cdd8f6; }
  .btn { width: 100%; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-size: 17px; font-weight: 650; padding: 14px 0; cursor: pointer; }
  .btn:disabled { background: #dcdde2; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); margin-top: 10px; }
  .info { background: #eef3ff; border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
  .info.warn { background: #fff7e0; }
  .agree { display: flex; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 12px; align-items: flex-start; }
  .agree input { margin-top: 2px; width: 16px; height: 16px; }
  .agree a, .link { color: var(--primary); text-decoration: underline; cursor: pointer; }

  .ch { background: #fff; border-radius: 14px; margin-bottom: 6px; position: relative; }
  .ch .ln { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; font-weight: 600; }
  .ch .ln:last-child, .ch.rec .ln { border-bottom: 0; }
  .ch .lg { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; }
  .ch .ln .nm { flex: 1; }
  .chtitle { display: flex; justify-content: space-between; font-size: 15px; font-weight: 650; margin: 16px 2px 8px; }
  .chtitle span.rt { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .chtitle .more { color: var(--primary); font-size: 13px; font-weight: 500; }
  .rec-tags { display: flex; gap: 6px; padding: 0 16px 12px 48px; margin-top: -6px; }
  .rec-tags span { background: var(--primary-soft); color: var(--primary); font-size: 11px; padding: 3px 8px; border-radius: 999px; }
  .star { position: absolute; top: 0; left: 0; background: var(--primary); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 12px 0 10px 0; }

  .demo { margin-top: 14px; border: 1.5px dashed #c3c7d2; border-radius: 12px; padding: 10px; background: #fff; }
  .qrbrand { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .5px; color: #fff; background: #1b3f8f; border-radius: 6px; padding: 3px 10px; margin-bottom: 8px; }
  .qrbox { display: flex; justify-content: center; }
  .qrbox svg { border: 1px solid var(--line); border-radius: 10px; }
  .push { background: rgba(255,255,255,.96); border-radius: 14px; box-shadow: 0 6px 18px rgba(20,30,60,.14); padding: 10px 12px; margin: 4px 0 6px; }
  .push .pt { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .push .pl { width: 16px; height: 16px; border-radius: 4px; background: var(--primary); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .push .pb { font-size: 13px; line-height: 1.45; }
  .toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); background: rgba(30,30,30,.86); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 8px; z-index: 5; white-space: nowrap; }
  .demo .dt { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .demo button { display: block; width: 100%; margin-top: 6px; border: 1px solid #d0d4de; background: #fafbfc; border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer; text-align: left; }

  .center { text-align: center; padding-top: 30px; }
  .ring { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; font-size: 34px; }
  .ring.ok { background: #e3f5ea; color: var(--green); }
  .ring.bad { background: #fde8e8; color: var(--red); }
  .ring.wait { background: var(--primary-soft); color: var(--primary); }
  .h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .p { font-size: 14px; color: #555b68; line-height: 1.55; }
  .doc { font-size: 12.5px; line-height: 1.6; color: #333; }
  .doc h4 { margin: 12px 0 4px; font-size: 13px; }

  .oa .row { font-size: 13px; padding: 5px 0; }
  .oa .ttl { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .oa .new { background: #fff3c4; border-radius: 4px; padding: 0 4px; font-size: 10px; color: #7a5a00; margin-left: 4px; font-weight: 600; }

  @media (max-width: 1100px) { .app { grid-template-columns: 220px 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">OFW 延期原型</div>
    <span class="mode">不换标 · 改原标还款日</span>
    <div class="gt">场景</div>
    <div class="seg" id="scSeg"></div>
    <div class="gt">这笔借款已延期</div>
    <div class="seg" id="cntSeg"></div>
    <div class="gt">延期进度</div>
    <div class="seg" id="phSeg"></div>
    <div class="gt">页面</div>
    <div class="plist" id="plist"></div>
    <button class="reset" onclick="resetFlow()">重置流程</button>
  </aside>
  <main class="stage"><div class="phone"><div class="screen" id="screen"></div></div></main>
</div>

<script>
  const CFG = { rate: 0.0016, penRate: 0.0016, options: [7, 14, 21, 30], maxCount: 1 };
  const LOAN_NO = 'KP20260824000088';
  const ORDER_NO = 'EXT20261102000016';
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const D = (y, m, d) => new Date(y, m - 1, d);

  const SC = {
    normal: { label: '未逾期 · 到期前 6 天', paid: 2, today: D(2026, 11, 18), inList: true },
    overdue: { label: '逾期 9 天', paid: 1, today: D(2026, 11, 2), inList: true },
    out: { label: 'CDS 返回不可延期', paid: 1, today: D(2026, 11, 2), inList: false },
  };
  const CNT = { c0: '0 次', c1: '1 次（已用完）' };
  const PHASE = { before: '延期前', after: '延期后' };

  const PAGES = [
    ['g', '生产页改造'],
    ['bill', '账单 · Current'],
    ['repay', '还款详情 · 入口'],
    ['g', '延期流程（延期页只有一页）'],
    ['ext', '延期页：选日期 · 费用 · 新计划'],
    ['agreement', '延期补充协议'],
    ['pay', '支付（生产渠道页）'],
    ['qr', 'QRPh 还款码'],
    ['scan', '钱包内付款 · 结果演示'],
    ['success', '延期成功'],
    ['failed', '未生效'],
    ['g', '延期后'],
    ['after', '还款详情 · 延期后'],
    ['history', '还款记录'],
    ['oa', '客服后台 · 标的详情'],
  ];

  const state = { sc: 'overdue', cnt: 'c0', phase: 'before', page: 'bill', billTab: 'current', planOpen: false, days: null, agreed: false, fail: null, over: 0, qrSeq: 0, channel: 'GCash' };

  function toast(text) {
    const scr = document.getElementById('screen');
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    scr.appendChild(t);
    setTimeout(() => t.remove(), 1600);
  }

  /* ---------- helpers ---------- */
  const addDays = (dt, n) => { const x = new Date(dt); x.setDate(x.getDate() + n); return x; };
  const diffDays = (a, b) => Math.round((b - a) / 86400000);
  const anchorMonth = (d1, k) => { const y = d1.getFullYear(), m = d1.getMonth() + k; const last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(d1.getDate(), last)); };
  const fmt = dt => `${dt.getDate()} ${MON[dt.getMonth()]} ${dt.getFullYear()}`;
  const fmtShort = dt => `${dt.getDate()} ${MON[dt.getMonth()]}`;
  const round2 = n => Math.round(n * 100) / 100;
  const money = n => '₱' + n.toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  const num = n => n.toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  const ord = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');

  function basePlan() {
    const p = [];
    for (let i = 1; i <= 6; i++) p.push({ no: i, due: new Date(2026, 7 + i, 24), principal: i === 1 ? 0 : 8000, interest: 2000 });
    return p;
  }

  function ctx() {
    const sc = SC[state.sc];
    const today = sc.today;
    const plan = basePlan().map(p => ({ ...p, paid: p.no <= sc.paid }));
    const unpaid = plan.filter(p => !p.paid);
    const cur = unpaid[0];
    const dpd = Math.max(0, diffDays(cur.due, today));
    const penalty = round2((cur.principal + cur.interest) * CFG.penRate * dpd);
    const pTotal = unpaid.reduce((s, p) => s + p.principal, 0);
    const reasons = [];
    if (!sc.inList) reasons.push('不在当天 CDS 名单');
    if (state.cnt === 'c1') reasons.push(`已延期 ${CFG.maxCount} 次，达到上限`);
    return { sc, today, plan, unpaid, cur, dpd, penalty, pTotal, eligible: reasons.length === 0, reasons };
  }

  const baseDate = c => (c.cur.due > c.today ? c.cur.due : c.today);
  const defaultDays = () => CFG.options[1];

  function quote(c, N) {
    N = N || defaultDays();
    const d1 = addDays(baseDate(c), N);
    const fee = round2(N * c.pTotal * CFG.rate);
    const interest = c.cur.interest;
    const pay = round2(fee + interest + c.penalty);
    const rows = c.unpaid.map((p, i) => {
      const it = i === 0 ? 0 : p.interest;
      return {
        no: p.no, oldDue: p.due, due: i === 0 ? d1 : anchorMonth(d1, i),
        principal: p.principal, interest: it, amt: p.principal + it, oldAmt: p.principal + p.interest,
      };
    });
    return { N, d1, fee, interest, pay, rows };
  }

  function feeLines(c, q) {
    return `
      <div class="row"><span class="k">Extension fee</span><span class="v">${money(q.fee)}</span></div>
      <div class="sub" style="margin:-4px 0 6px">${q.N} days × ${money(c.pTotal)} × 0.16% per day</div>
      <div class="row"><span class="k">Interest + service fee</span><span class="v">${money(q.interest)}</span></div>
      <div class="sub" style="margin:-4px 0 6px">This month's, collected now. Your next bill is principal only.</div>
      ${c.penalty > 0 ? `<div class="row"><span class="k">Overdue penalty</span><span class="v">${money(c.penalty)}</span></div>
      <div class="sub" style="margin:-4px 0 6px">${c.dpd} days overdue</div>` : ''}
      <div class="hr"></div>
      <div class="row"><span class="k" style="color:var(--ink);font-weight:650">Pay now</span><span class="v" style="font-size:18px">${money(q.pay)}</span></div>`;
  }
  const feeShort = (c, q) => `Extension fee ${money(q.fee)} · Interest + fee ${money(q.interest)}${c.penalty > 0 ? ` · Penalty ${money(c.penalty)}` : ''}`;

  function dueTag(today, due, dpd) {
    if (dpd > 0) return { cls: 'red', text: 'Overdue' };
    return diffDays(today, due) <= 7 ? { cls: 'yellow', text: 'Current due' } : { cls: 'green', text: 'Upcoming due' };
  }

  /* ---------- shells ---------- */
  function shell(title, body, foot, opts = {}) {
    const back = opts.back ? `<div class="back" onclick="go('${opts.back}')">‹</div>` : '<div></div>';
    const right = opts.right ? `<div class="right" onclick="go('${opts.right[1]}')">${opts.right[0]}</div>` : '<div></div>';
    return {
      grad: opts.grad !== false,
      html: `<div class="sbar"><span>9:41</span><span>Kidlat Peso</span><span>100%</span></div>
        <div class="hdr">${back}<div class="title">${title}</div>${right}</div>
        <div class="body">${body}</div>
        ${foot ? `<div class="foot ${opts.whiteFoot ? 'white' : ''}">${foot}</div>` : ''}`,
    };
  }

  function planList(items) {
    return `<div class="tl">${items.map(it => `
      <div class="it">
        <div class="dot ${it.cur ? 'cur' : ''}"></div>
        <div>${it.oldDate ? `<div class="n"><span class="old">${it.oldDate}</span></div>` : ''}<div class="d">${it.date}</div><div class="n">${it.n}</div></div>
        <div>${it.oldAmt ? `<div class="n" style="text-align:right"><span class="old">${it.oldAmt}</span></div>` : ''}<div class="a">${it.amt}</div><div class="s ${it.cls || ''}">${it.status}</div></div>
      </div>`).join('')}</div>`;
  }

  function oldPlanItems(c) {
    return c.plan.map(p => {
      let status = 'Upcoming due', cls = '';
      if (p.paid) status = 'Paid';
      else if (p === c.cur) { status = c.dpd > 0 ? 'Overdue' : 'Current Due'; cls = c.dpd > 0 ? 'overdue' : 'current'; }
      return { date: fmt(p.due), n: `${p.no}/6`, amt: money(p.principal + p.interest), status, cls, cur: p === c.cur };
    });
  }

  function newPlanItems(q, showOld) {
    return q.rows.map((r, i) => ({
      date: fmt(r.due), oldDate: showOld ? fmt(r.oldDue) : null, n: `${r.no}/6`,

  function qrSvg(seed) {
    const n = 25, cell = 7;
    let x = seed * 9301 + 49297;
    const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
    const finder = (r, c) => {
      const inBox = (r0, c0) => r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7;
      const box = inBox(0, 0) ? [0, 0] : inBox(0, n - 7) ? [0, n - 7] : inBox(n - 7, 0) ? [n - 7, 0] : null;
      if (!box) return null;
      const rr = r - box[0], cc = c - box[1];
      const ring = rr === 0 || rr === 6 || cc === 0 || cc === 6;
      const core = rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4;
      return ring || core;
    };
    let rects = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const f = finder(r, c);
      const on = f === null ? rnd() > 0.52 : f;
      if (on) rects += `<rect x="${c * cell}" y="${r * cell}" width="${cell}" height="${cell}"/>`;
    }
    const s = n * cell;
    return `<svg viewBox="-14 -14 ${s + 28} ${s + 28}" width="190" height="190" xmlns="http://www.w3.org/2000/svg"><rect x="-14" y="-14" width="${s + 28}" height="${s + 28}" fill="#fff"/><g fill="#111">${rects}</g></svg>`;
  }

        <div class="ttl">延期记录${nw}</div>
        <div class="row"><span class="k">延期申请号</span><span class="v">${refNo()}</span></div>
        <div class="row"><span class="k">CDS 决策号</span><span class="v">CDSD${c.today.getFullYear()}${String(c.today.getMonth() + 1).padStart(2, '0')}${String(c.today.getDate()).padStart(2, '0')}143140</span></div>
        <div class="row"><span class="k">支付渠道</span><span class="v">QRPh · GCash</span></div>
        <div class="row"><span class="k">生效时间</span><span class="v">${fmt(c.today)} 14:32</span></div>
        <div class="row"><span class="k">延期天数</span><span class="v">${q.N}</span></div>
        <div class="row"><span class="k">当期应还日</span><span class="v">${fmtShort(c.cur.due)} → ${fmtShort(q.d1)}</span></div>
        <div class="row"><span class="k">应付分项</span><span class="v">费 ${money(q.fee)} · 息 ${money(q.interest)}${c.penalty > 0 ? ` · 罚 ${money(c.penalty)}` : ''}</span></div>
        <div class="row"><span class="k">实付 / 多付</span><span class="v">${money(q.pay + state.over)} / ${money(state.over)}</span></div>
      </div>` : '<div class="sub" style="padding:0 4px">切到「延期后」查看延期记录。</div>'}`;
    return shell('客服后台 · 标的', body, '', { back: 'bill', grad: false });
  }

  const RENDER = {
    bill: pgBill, repay: pgRepay, ext: pgExt, agreement: pgAgreement, pay: pgPay, qr: pgQr, scan: pgScan,
    success: pgSuccess, failed: pgFailed, after: pgAfter, history: pgHistory, oa: pgOA,
  };

  /* ---------- control ---------- */
  function go(page) { state.page = page; render(); }
  function sideGo(page) {
    if (page === 'bill') state.billTab = 'current';
    if (page !== 'bill' && page !== 'repay' && !state.days) state.days = defaultDays();
    if (page === 'success' || page === 'after') state.phase = 'after';
    if (['repay', 'ext', 'pay', 'qr', 'scan'].includes(page) && state.phase === 'after') state.phase = 'before';
    if (page === 'failed') { if (!state.fail) state.fail = 'partial'; state.phase = 'before'; }
    go(page);
  }
  function resetFlow() {
    Object.assign(state, { page: 'bill', billTab: 'current', planOpen: false, days: null, agreed: false, fail: null, over: 0, phase: 'before' });
    render();
  }
  function setPhase(p) {
    state.phase = p;
    if (p !== 'before' && !state.days) state.days = defaultDays();
    if (p !== 'after') state.over = 0;
    state.page = 'bill';
    render();
  }

  function renderSide() {
    document.getElementById('scSeg').innerHTML = Object.entries(SC).map(([k, v]) =>
      `<button class="${state.sc === k ? 'on' : ''}" onclick="state.sc='${k}';resetFlow()">${v.label}</button>`).join('');
    document.getElementById('cntSeg').innerHTML = Object.entries(CNT).map(([k, v]) =>
      `<button class="${state.cnt === k ? 'on' : ''}" onclick="state.cnt='${k}';resetFlow()">${v}</button>`).join('');
    document.getElementById('phSeg').innerHTML = Object.entries(PHASE).map(([k, v]) =>
      `<button class="${state.phase === k ? 'on' : ''}" onclick="setPhase('${k}')">${v}</button>`).join('');
    document.getElementById('plist').innerHTML = PAGES.map(([id, label]) => id === 'g'
      ? `<div class="grp">${label}</div>`
      : `<a class="${state.page === id ? 'on' : ''}" onclick="sideGo('${id}')">${label}</a>`).join('');
  }

  function render() {
    renderSide();
    const r = RENDER[state.page]();
    const scr = document.getElementById('screen');
    scr.className = 'screen' + (r.grad ? ' grad' : '');
    scr.innerHTML = r.html;
  }

  const [start, startPhase] = location.hash.slice(1).split('@');
  if (start && RENDER[start]) {
    sideGo(start);
    if (startPhase && PHASE[startPhase]) { state.phase = startPhase; render(); }
  } else render();
</script>
</body>
</html>
