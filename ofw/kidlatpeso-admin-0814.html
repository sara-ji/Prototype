    function openRebindModal(userId) {
      if (!isSalesMgmtMenu()) return;
      const u = getUser(userId);
      if (!u) return;
      rebindUserId = userId;
      document.getElementById('rebind-modal-title').textContent = t('rebind_title');
      document.getElementById('rebind-modal-cancel').textContent = t('cancel');
      document.getElementById('rebind-modal-ok').textContent = t('confirm');
      const opts = salesFilterOptions().map(s =>
        `<option value="${esc(s)}"${u.salesRep===s?' selected':''}>${esc(s)}</option>`
      ).join('');
      document.getElementById('rebind-modal-body').innerHTML = `
        <div class="form-row">
          <label class="form-label" for="rebind-sales-select"><span class="req">*</span>${t('rebind_filler')}</label>
          <div class="form-control">
            <select id="rebind-sales-select" class="kv-input">
              <option value="">${t('rebind_select_ph')}</option>
              ${opts}
            </select>
          </div>
        </div>`;
      document.getElementById('rebind-modal').classList.add('open');
    }

    function closeRebindModal() {
      document.getElementById('rebind-modal').classList.remove('open');
      rebindUserId = null;
    }

    function confirmRebindModal() {
      const u = getUser(rebindUserId);
      const sel = document.getElementById('rebind-sales-select');
      const val = sel?.value || '';
      if (!u) { closeRebindModal(); return; }
      if (!val) { alert(t('rebind_need_select')); return; }
      u.salesRep = val;
      closeRebindModal();
      alert(t('rebind_ok'));
      render();
    }

    function renderFileField(dataObj, field, editable, uploadFn) {
      const v = dataObj[field.key] || '';
      const url = isImageUrl(v) ? v : (v ? mockFileUrl(field.key) : '');
      if (!v) {
        return editable
          ? `<div class="file-field"><span class="file-empty">${t('not_uploaded')}</span><button type="button" class="btn-sm" onclick="${uploadFn}">${t('upload')}</button></div>`
          : `<div class="field-read empty"><em>${t('not_filled')}</em></div>`;
      }
      const thumb = url
        ? `<button type="button" class="img-thumb-btn" onclick="openLightbox('${esc(url)}')">
             <img class="field-thumb" src="${esc(url)}" alt="${esc(field.label)}" />
           </button>`
        : `<span class="file-ok">${esc(v)}</span>`;
      return editable
        ? `<div class="file-field file-field-img">${thumb}<button type="button" class="btn-sm" onclick="${uploadFn}">${t('reupload')}</button></div>`
        : `<div class="file-field-img">${thumb}</div>`;
    }

    function renderFieldInput(dataObj, field, editable, changeFn, uploadFn) {
      const v = fieldDisplayValue(dataObj, field.key);
      const empty = !v;
      if (field.type === 'file') return renderFileField(dataObj, field, editable, uploadFn);
      if (!editable) {
        return `<div class="field-read${empty?' empty':''}">${empty ? `<em>${t('not_filled')}</em>` : esc(v)}</div>`;
      }
      if (field.type === 'select') {
        return `<select onchange="${changeFn}">
          <option value="">${t('please_select')}</option>
          ${field.options.map(o => `<option value="${esc(o)}"${v===o?' selected':''}>${esc(o)}</option>`).join('')}
        </select>`;
      }
      return `<input type="${field.type}" value="${esc(v)}" placeholder="${esc(t('to_fill'))}" onchange="${changeFn}" />`;
    }

    function uploadField(userId, key) {
      const u = getUser(userId);
      if (!u || !isFieldKeyEditable(u, key, u.fields)) return;
      u.fields[key] = mockFileUrl(key);
      render();
    }

    function updateComakerField(userId, cmId, key, value) {
      const u = getUser(userId);
      const cm = u?.comakers?.find(c => c.id === cmId);
      if (!cm || !isComakerEditable(u, cm)) return;
      if (key === 'cm_phone' && isPhoneIdentityLocked('cm_phone', cm.fields)) return;
      if (key !== 'cm_phone' && !canEditThisField(key, u)) return;
      if (key === 'cm_residential') setMergedResidential(cm.fields, key, value);
      else cm.fields[key] = value;
      if (cm.status === 'draft' && cm.fields.cm_first && cm.fields.cm_phone) cm.status = 'ready';
      render();
    }

    function uploadComakerField(userId, cmId, key) {
      const u = getUser(userId);
      const cm = u?.comakers?.find(c => c.id === cmId);
      if (!cm || !isComakerEditable(u, cm)) return;
      cm.fields[key] = mockFileUrl(key);
      render();
    }

    function addComaker(userId) {
      const u = getUser(userId);
      if (!u || !canEditComakers(u) || !canAddComakerInMenu()) return;
      if (!u.comakers) u.comakers = [];
      u.comakers.push({ id: newComakerId(), status: 'draft', isBasic: false, fields: {} });
      render();
    }

    function findFieldDef(user, key, cmId) {
      if (cmId) {
        const cm = user.comakers?.find(c => c.id === cmId);
        if (!cm) return null;
        return getComakerFields(cm, user).find(f => f.key === key) || null;
      }
      for (const sec of (FIELD_SECTIONS[user.flow] || [])) {
        const f = sec.fields.find(x => x.key === key);
        if (f) return f;
      }
      return null;
    }

    function openEditModal(userId, fieldKey, cmId) {
      const user = getUser(userId);
      if (!user) return;
      const field = findFieldDef(user, fieldKey, cmId || null);
      if (!field) return;
      const dataObjForGate = cmId
        ? (user.comakers.find(c => c.id === cmId)?.fields || {})
        : user.fields;
      if (field.key === 'mobile' || (field.key === 'cm_phone' && isPhoneIdentityLocked('cm_phone', dataObjForGate))) {
        alert(lang === 'zh'
          ? '手机号不可在后台修改，请用户 / 担保人在 APP 申请换绑（二期）。'
          : 'Phone cannot be changed in Backend. User / co-maker must apply rebind in APP (Phase 2).');
        return;
      }
      if (field.key !== 'cm_phone' && !canEditThisField(field.key, user)) return;
      if (cmId) {
        const cm = user.comakers?.find(c => c.id === cmId);
        if (!cm || !isComakerEditable(user, cm)) return;
      } else if (!isFieldKeyEditable(user, field.key, dataObjForGate)) {
        return;
      }
      editCtx = { userId, cmId: cmId || null, field };
      const dataObj = dataObjForGate;
      const v = fieldDisplayValue(dataObj, field.key);
      document.getElementById('edit-modal-title').textContent = `${t('edit')} · ${field.label}`;
      document.getElementById('edit-modal-cancel').textContent = t('cancel');
      document.getElementById('edit-modal-ok').textContent = t('confirm');
      let body = `<label>${esc(field.label)}</label>`;
      if (field.type === 'file') {
        body += `<div class="file-field" style="margin-top:4px">
          <span class="file-empty" id="edit-modal-file-status">${v ? t('file_ok') : t('not_uploaded')}</span>
          <button type="button" class="btn-sm" onclick="modalPickFile()">${v ? t('reupload') : t('upload')}</button>
        </div>
        <input type="hidden" id="edit-modal-input" value="${esc(v)}" />`;
      } else if (field.type === 'select') {
        body += `<select id="edit-modal-input" class="kv-input">
          <option value="">${t('please_select')}</option>
          ${(field.options || []).map(o => `<option value="${esc(o)}"${v===o?' selected':''}>${esc(o)}</option>`).join('')}
        </select>`;
      } else {
        body += `<input id="edit-modal-input" class="kv-input" type="${field.type || 'text'}" value="${esc(v)}" placeholder="${esc(t('to_fill'))}" />`;
      }
      document.getElementById('edit-modal-body').innerHTML = body;
      document.getElementById('edit-modal').classList.add('open');
      document.body.style.overflow = 'hidden';
      const input = document.getElementById('edit-modal-input');
      if (input && field.type !== 'file') setTimeout(() => input.focus(), 50);
    }

    function modalPickFile() {
      if (!editCtx) return;
      const url = mockFileUrl(editCtx.field.key);
      const input = document.getElementById('edit-modal-input');
      if (input) input.value = url;
      const st = document.getElementById('edit-modal-file-status');
      if (st) st.textContent = t('file_ok');
      const btn = document.querySelector('#edit-modal-body .btn-sm');
      if (btn) btn.textContent = t('reupload');
    }

    function closeEditModal() {
      editCtx = null;
      document.getElementById('edit-modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    function confirmEditModal() {
      if (!editCtx) return;
      const input = document.getElementById('edit-modal-input');
      const value = input ? input.value : '';
      const { userId, cmId, field } = editCtx;
      closeEditModal();
      if (cmId) {
        updateComakerField(userId, cmId, field.key, value);
      } else {
        updateField(userId, field.key, value);
        render();
      }
    }

    function renderEditBtn(userId, field, cmId) {
      const cmArg = cmId ? `,'${cmId}'` : '';
      return `<button type="button" class="btn-edit-icon" title="${esc(t('edit'))}" onclick="openEditModal('${userId}','${field.key}'${cmArg})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </button>`;
    }

    function renderKvValue(dataObj, field, editable, changeFn, uploadFn, editMeta) {
      const v = fieldDisplayValue(dataObj, field.key);
      const empty = !v;
      const user = editMeta?.userId ? getUser(editMeta.userId) : null;
      const canEdit = editable && editMeta && (!user || canEditThisField(field.key, user));
      const editIcon = canEdit ? renderEditBtn(editMeta.userId, field, editMeta.cmId) : '';

      if (field.type === 'file') {
        if (empty) {
          return `<div class="kv-value-row"><span class="kv-empty">—</span>${editIcon}</div>`;
        }
        const url = isImageUrl(v) ? v : mockFileUrl(field.key);
        const thumb = `<button type="button" class="img-thumb-btn" onclick="openLightbox('${esc(url)}')">
             <img class="field-thumb" src="${esc(url)}" alt="${esc(field.label)}" />
           </button>`;
        return `<div class="kv-value-row file-field-img">${thumb}${editIcon}</div>`;
      }

      const text = empty ? '<span class="kv-empty">—</span>' : esc(v);
      if (canEdit) return `<div class="kv-value-row"><span>${text}</span>${editIcon}</div>`;
      return empty ? '<span class="kv-empty">—</span>' : esc(v);
    }

    function renderKvRows(fields, dataObj, editable, changeFnFor, uploadFnFor, editMeta) {
      const user = editMeta?.userId ? getUser(editMeta.userId) : null;
      const flags = user ? flaggedFieldKeys(user) : [];
      const textFields = fields.filter(f => f.type !== 'file');
      const fileFields = fields.filter(f => f.type === 'file');
      let html = '';
      const cell = (f) => {
        const fieldEdit = user ? isFieldKeyEditable(user, f.key, dataObj, editMeta?.cmId) : editable;
        const flagged = flags.includes(f.key);
        const flagTag = flagged
          ? `<span class="tag tag-warning" style="margin-left:6px;font-size:10px">${esc(userStatus(user) === 'MANUAL_PENDING' ? t('flag_pending') : t('flag_return'))}</span>`
          : '';
        const labelCls = `kv-label${flagged ? ' kv-flagged-label' : ''}`;
        const valueCls = `kv-value${flagged ? ' kv-flagged' : ''}`;
        return `<th class="${labelCls}">${esc(f.label)}${flagTag}</th><td class="${valueCls}">${renderKvValue(dataObj, f, fieldEdit, changeFnFor(f), uploadFnFor(f), fieldEdit ? editMeta : null)}</td>`;
      };
      for (let i = 0; i < textFields.length; i += 3) {
        const chunk = textFields.slice(i, i + 3);
        html += '<tr>';
        for (let j = 0; j < 3; j++) {
          const f = chunk[j];
          if (f) html += cell(f);
          else html += '<th class="kv-label kv-pad"></th><td class="kv-value kv-pad"></td>';
        }
        html += '</tr>';
      }
      fileFields.forEach(f => {
        const fieldEdit = user ? isFieldKeyEditable(user, f.key, dataObj, editMeta?.cmId) : editable;
        const flagged = flags.includes(f.key);
        const flagTag = flagged
          ? `<span class="tag tag-warning" style="margin-left:6px;font-size:10px">${esc(userStatus(user) === 'MANUAL_PENDING' ? t('flag_pending') : t('flag_return'))}</span>`
          : '';
        html += `<tr><th class="kv-label kv-photo-label${flagged ? ' kv-flagged-label' : ''}">${esc(f.label)}${flagTag}</th><td class="kv-value kv-photo-value${flagged ? ' kv-flagged' : ''}" colspan="5">${renderKvValue(dataObj, f, fieldEdit, changeFnFor(f), uploadFnFor(f), fieldEdit ? editMeta : null)}</td></tr>`;
      });
      return html;
    }

    function renderKvSection(title, fields, dataObj, editable, opts = {}) {
      const extra = opts.extraHead || '';
      const changeFnFor = opts.changeFnFor || (() => '');
      const uploadFnFor = opts.uploadFnFor || (() => '');
      const editMeta = opts.editMeta || null;
      return `
        <div class="info-block${opts.className ? ' ' + opts.className : ''}">
          <div class="info-block-title">${esc(title)}${extra}</div>
          <table class="kv-table">
            <tbody>${renderKvRows(fields, dataObj, editable, changeFnFor, uploadFnFor, editMeta)}</tbody>
          </table>
        </div>`;
    }

    function renderComakerSection(user) {
      if (!showComakerSection(user)) return '';
      const cms = user.comakers || [];
      const canManage = false;
      let html = `<div class="info-block comaker-block">
        <div class="info-block-title comaker-block-title">
          <span>${t('comaker_info')}</span>
          ${canManage ? `<button type="button" class="btn-sm primary" onclick="addComaker('${user.id}')">${t('add_comaker')}</button>` : ''}
        </div>`;
      if (!cms.length) {
        html += `<p class="empty-hint" style="padding:12px 16px">${t('no_comaker')}</p>`;
      }
      cms.forEach((cm, idx) => {
        const cmEditable = isComakerEditable(user, cm);
        const fields = getComakerFields(cm, user);
        const headExtra = `
          <div class="comaker-card-head">
            <strong>${t('comaker_n')} ${idx + 1} · ${esc(comakerDisplayName(cm))}</strong>
            <div class="comaker-badges">
              ${comakerStatusBadge(user, cm)}
            </div>
          </div>
          ${isActiveComakerLocked(user, cm) ? `<div class="comaker-lock-hint">${lang==='zh'?'担保中的 Co-maker 不可修改':'Guaranteeing co-maker is locked'}</div>` : (cmEditable ? `<div class="comaker-lock-hint" style="color:var(--success)">${lang==='zh'?'未在担保中，可修改':'Not guaranteeing — editable'}</div>` : '')}`;
        html += `
          <div class="comaker-inner${isActiveComakerLocked(user, cm) ? ' locked' : ''}">
            ${headExtra}
            <table class="kv-table">
              <tbody>${renderKvRows(
                fields, cm.fields, cmEditable,
                f => `updateComakerField('${user.id}','${cm.id}','${f.key}',this.value)`,
                f => `uploadComakerField('${user.id}','${cm.id}','${f.key}')`,
                cmEditable ? { userId: user.id, cmId: cm.id } : null
              )}</tbody>
            </table>
          </div>`;
      });
      html += '</div>';
      return html;
    }

    function renderProfileSections(user, editable) {
      const sections = visibleSections(user);
      const code = userStatus(user);
      const flags = flaggedFieldKeys(user);
      // Sales detail already shows teamBEditHint above — skip duplicate status banners here.
      // Keep lockNote only for states that tip does not cover (in-review / rejected / locked after listing).
      let lockNote = '';
      if (isSalesAssistMenu()) {
        if (['LOAN_REVIEWING', 'LOAN_REJECTED', 'DISBURSING', 'DISBURSED', 'DISBURSED_FAILED'].includes(code)) {
          lockNote = `<div class="alert alert-lock" style="margin-bottom:12px">${lang==='zh'
            ? '本人资料已锁定，不可修改。'
            : 'Borrower profile locked.'}</div>`;
        } else if (code === 'PRE_REVIEWING' || code === 'FINAL_REVIEWING') {
          lockNote = `<div class="alert alert-lock" style="margin-bottom:12px">${lang==='zh'?'审核处理中，暂不可改资料':'Under review — profile temporarily read-only'}</div>`;
        } else if (code === 'PRE_REJECTED' || code === 'FINAL_REJECTED') {
          lockNote = `<div class="alert alert-lock" style="margin-bottom:12px">${lang==='zh'?'已拒绝，资料只读':'Rejected — profile read-only'}</div>`;
        }
      }
      return lockNote + sections.map(sec =>
        renderKvSection(sectionTitle(sec.title), sec.fields, user.fields, editable, {
          changeFnFor: f => `updateField('${user.id}','${f.key}',this.value)`,
          uploadFnFor: f => `uploadField('${user.id}','${f.key}')`,
          editMeta: { userId: user.id, cmId: null },
        })
      ).join('') + renderComakerSection(user);
    }

    function renderUserSummaryCard(user) {
      return `
        <div class="info-block summary-block">
          <div class="info-block-title">${t('basic_info')}</div>
          <table class="kv-table"><tbody>
            <tr>
              <th class="kv-label">${t('reg_channel')}</th><td class="kv-value">OFW</td>
              <th class="kv-label">${t('col_user_id')}</th><td class="kv-value">${esc(user.id)}</td>
              <th class="kv-label">${t('mobile')}</th><td class="kv-value">${esc(user.mobile)}</td>
            </tr>
            <tr>
              <th class="kv-label">${t('registered_at')}</th><td class="kv-value">${esc(user.registeredAt)}</td>
              <th class="kv-label">${t('user_version')}</th><td class="kv-value">${flowBadge(user.flow)}</td>
              <th class="kv-label">${t('profile_status')}</th><td class="kv-value">${profileStatusBadge(user)}</td>
            </tr>
            <tr>
              <th class="kv-label">${t('name')}</th><td class="kv-value">${esc(user.name)}</td>
              <th class="kv-label">${t('attr_channel')}</th><td class="kv-value">${esc(user.channel)}</td>
              <th class="kv-label">${t('sales_rep')}</th><td class="kv-value">${esc(user.salesRep)}</td>
            </tr>
          </tbody></table>
        </div>`;
    }

    function renderBreadcrumb() {
      const info = getMenus()[menu];
      if (view !== 'detail') return '';
      const user = getUser(selectedUserId);
      return `<div class="breadcrumb">
        <button type="button" onclick="goList()">${esc(info.label)}</button>
        <span>/</span>
        <span>${esc(user?.name || t('user_detail'))}</span>
      </div>`;
    }

    function renderUserDetail() {
      const user = getUser(selectedUserId);
      if (!user) return renderUserList();

      const header = isSalesAssistMenu() ? `
        ${renderBreadcrumb()}
        ${renderUserSummaryCard(user)}
      ` : '';

      if (isSalesAssistMenu()) {
        const profileEditable = isFieldEditable(user) || userStatus(user) === 'MANUAL_PENDING';
        const showSave = hasAnyEditableField(user);
        const help = renderMgmtOnlyHelp();
        const saveLabel = userStatus(user) === 'MANUAL_PENDING'
          ? (lang === 'zh' ? '保存并通知审核员' : 'Save & notify reviewer')
          : (userStatus(user) === 'MANUAL_RETURNED'
            ? (lang === 'zh' ? '保存并重新终审' : 'Save & re-submit final')
            : t('save'));
        return header + `
          <div class="alert ${showSave ? 'alert-ok' : 'alert-lock'}">${teamBEditHint(user)}${help}</div>
          <div class="tab-body">${renderProfileSections(user, profileEditable)}</div>
          ${showSave ? `<div class="save-bar"><button type="button" class="btn-primary" onclick="saveProfile('${user.id}')">${esc(saveLabel)}</button></div>` : ''}
        `;
      }

      if (menu === 'review') {
        return renderReviewDetailPage(user);
      }

      return renderUserList();
    }

    function updateField(userId, key, value) {
      const u = getUser(userId);
      if (!u || !isFieldKeyEditable(u, key, u.fields)) return;
      if (key === 'ph_residential' || key === 'c1_residential' || key === 'c2_residential') {
        setMergedResidential(u.fields, key, value);
      } else u.fields[key] = value;
      if (u.fields.first_name || u.fields.last_name) {
        u.name = `${u.fields.first_name || ''} ${u.fields.last_name || ''}`.trim() || u.name;
      }
    }

    function saveProfile(userId) {
      const u = getUser(userId);
      if (!u) return;
      const code = userStatus(u);
      if (code === 'MANUAL_PENDING') {
        const reviewer = u.pendingReviewer || 'zenaida';
        u.statusCode = 'LOAN_REVIEWING';
        u.listingStatus = 'reviewing';
        u.pendingFields = [];
        u.pendingUntil = '';
        const ac = auditCases.find(c => c.userId === userId);
        if (ac) { ac.auditStatus = 'pending'; ac.auditOwner = reviewer; }
        notifyReviewerForUser({ ...u, pendingReviewer: reviewer }, 'user_fixed');
        alert(t('alert_saved_pending') + '\n' + (lang === 'zh' ? `审核员：${reviewer}` : `Reviewer: ${reviewer}`));
      } else if (code === 'MANUAL_RETURNED') {
        u.statusCode = 'FINAL_REVIEWING';
        u.returnFields = [];
        u.listingStatus = 'failed';
        notifyReviewerForUser(u, 'return_resubmit');
        alert(t('alert_saved_return_final'));
        setTimeout(() => {
          u.statusCode = 'LIMIT_READY';
          alert(lang === 'zh' ? '终审已通过（演示），可重新确认借款发标。' : 'Final approved (demo) — ready to re-list.');
          render();
        }, 600);
      } else {
        alert(t('alert_saved'));
      }
      render();
    }

    function collectMarkedFieldKeys(userId, markType) {
      if (decisionDraft?.userId === userId && decisionDraft.issues?.length) {
        return [...new Set(decisionDraft.issues.map(i => i.fieldKey).filter(Boolean))];
      }
      const s = reviewAuditState[userId] || {};
      const want = markType || 'return';
      return Object.keys(s).filter(k => normalizeMark(s[k]) === want);
    }

    function notifySalesOrMgmt(user) {
      const rep = (user.salesRep || '').trim();
      if (rep && rep !== '—' && rep.toLowerCase() !== 'unassigned') {
        return lang === 'zh' ? `已通知跟进销售 ${rep}` : `Notified sales ${rep}`;
      }
      return lang === 'zh' ? '无跟进销售，已通知销管' : 'No sales rep — notified mgmt';
    }

    function pushRiskDecision(userId) {
      /* legacy no-op — tags are submitted via Pass / Not-pass actions */
      reviewDecision(userId, 'pass');
    }

    function issuesFromMarks(user, outcome) {
      const items = getDecisionItems(user, outcome === 'reject' ? 'return' : outcome);
      const audit = reviewAuditState[user.id] || {};
      const want = markWantForOutcome(outcome);
      return items
        .filter(m => normalizeMark(audit[m.fieldKey]) === want)
        .map(issueFromDecisionItem);
    }

    function openDecisionModal(userId, presetOutcome) {
      const user = getUser(userId);
      if (!user || isPendingHoldActive(user)) return;
      const outcome = presetOutcome || 'return';
      if (!materialsAuditComplete(user)) {
        showToast(t('rv_gate_materials_incomplete'));
        return;
      }
      if (outcome === 'return' && !canSubmitReturn(user)) {
        showToast(returnBlockReason(user));
        return;
      }
      if (outcome === 'reject' && !canSubmitReject(user)) {
        showToast(rejectBlockReason(user));
        return;
      }
      if (outcome === 'pending' && !canSubmitPending(user)) {
        showToast(pendingBlockReason(user));
        return;
      }
      decisionDraft = {
        userId,
        outcome,
        bizTags: [],
        issues: issuesFromMarks(user, outcome),
        muteExempt: false,
        note: '',
        personFilter: 'all',
      };
      renderDecisionModal();
      document.getElementById('decision-modal').classList.add('open');
    }

    function closeDecisionModal() {
      document.getElementById('decision-modal')?.classList.remove('open');
      decisionDraft = null;
    }

    function setDecisionOutcome(outcome) {
      if (!decisionDraft) return;
      const user = getUser(decisionDraft.userId);
      if (!user) return;
      if (outcome === 'return' && !canSubmitReturn(user)) { showToast(returnBlockReason(user)); return; }
      if (outcome === 'reject' && !canSubmitReject(user)) { showToast(rejectBlockReason(user)); return; }
      if (outcome === 'pending' && !canSubmitPending(user)) { showToast(pendingBlockReason(user)); return; }
      decisionDraft.outcome = outcome;
      decisionDraft.issues = issuesFromMarks(user, outcome);
      renderDecisionModal();
    }

    function setDecisionPersonFilter(filter) {
      if (!decisionDraft) return;
      decisionDraft.personFilter = filter;
      renderDecisionModal();
    }

    function toggleBizTag(tag) {
      if (!decisionDraft) return;
      const i = decisionDraft.bizTags.indexOf(tag);
      if (i >= 0) decisionDraft.bizTags.splice(i, 1);
      else decisionDraft.bizTags.push(tag);
      renderDecisionModal();
    }

    function toggleDecisionMaterial(key) {
      if (!decisionDraft) return;
      const user = getUser(decisionDraft.userId);
      const item = getDecisionItems(user, decisionDraft.outcome).find(m => m.key === key);
      if (!item) return;
      const idx = decisionDraft.issues.findIndex(i => i.key === key);
      if (idx >= 0) {
        decisionDraft.issues.splice(idx, 1);
        if (item.fieldKey && reviewAuditState[decisionDraft.userId]) {
          const want = markWantForOutcome(decisionDraft.outcome);
          if (normalizeMark(reviewAuditState[decisionDraft.userId][item.fieldKey]) === want) {
            delete reviewAuditState[decisionDraft.userId][item.fieldKey];
          }
        }
      } else {
        decisionDraft.issues.push(issueFromDecisionItem(item));
        if (item.fieldKey) {
          if (!reviewAuditState[decisionDraft.userId]) reviewAuditState[decisionDraft.userId] = {};
          reviewAuditState[decisionDraft.userId][item.fieldKey] = markWantForOutcome(decisionDraft.outcome);
        }
      }
      render();
      renderDecisionModal();
    }

    function updateIssueField(key, field, value) {
      if (!decisionDraft) return;
      const issue = decisionDraft.issues.find(i => i.key === key);
      if (!issue) return;
      issue[field] = value;
    }

    function removeDecisionIssue(key) {
      if (!decisionDraft) return;
      const issue = decisionDraft.issues.find(i => i.key === key);
      decisionDraft.issues = decisionDraft.issues.filter(i => i.key !== key);
      if (issue?.fieldKey && reviewAuditState[decisionDraft.userId]) {
        const want = markWantForOutcome(decisionDraft.outcome);
        if (normalizeMark(reviewAuditState[decisionDraft.userId][issue.fieldKey]) === want) {
          delete reviewAuditState[decisionDraft.userId][issue.fieldKey];
        }
      }
      render();
      renderDecisionModal();
    }

    function toggleMuteExempt() {
      if (!decisionDraft) return;
      decisionDraft.muteExempt = !decisionDraft.muteExempt;
      renderDecisionModal();
    }

    function riskBadgeFor(userId, fieldKey) {
      const st = normalizeMark(reviewAuditState[userId]?.[fieldKey]);
      if (st === 'pass') return `<span class="dec-mat-badge pass">${t('rv_stat_pass')}</span>`;
      if (st === 'return') return `<span class="dec-mat-badge reject">${t('rv_stat_return')}</span>`;
      if (st === 'pending') return `<span class="dec-mat-badge idle">${t('rv_stat_pending')}</span>`;
      if (st === 'reject') return `<span class="dec-mat-badge reject">${t('rv_stat_reject')}</span>`;
      return `<span class="dec-mat-badge idle">${t('rv_stat_idle')}</span>`;
    }

    function renderDecisionModal() {
      if (!decisionDraft) return;
      const user = getUser(decisionDraft.userId);
      if (!user) return;
      const outcome = decisionDraft.outcome;

      document.getElementById('decision-modal-title').textContent = t('dec_title');
      document.getElementById('decision-modal-cancel').textContent = t('dec_cancel');
      document.getElementById('decision-modal-ok').textContent = t('dec_confirm');

      const outcomeMeta = {
        return: { count: countFieldMarks(user.id).returned, enabled: canSubmitReturn(user), title: returnBlockReason(user) },
        pending: { count: countFieldMarks(user.id).pending, enabled: canSubmitPending(user), title: pendingBlockReason(user) },
        reject: { count: countFieldMarks(user.id).rejected, enabled: canSubmitReject(user), title: rejectBlockReason(user) },
      };
      const outcomeCards = [
        { id: 'return', title: t('dec_return_title'), desc: t('dec_return_desc'), cls: 'return' },
        { id: 'pending', title: t('dec_pending_title'), desc: t('dec_pending_desc'), cls: 'pending' },
        { id: 'reject', title: t('dec_reject_title'), desc: t('dec_reject_desc'), cls: 'reject' },
      ].map(o => `
        <button type="button" class="dec-outcome ${o.cls}${outcome === o.id ? ' on' : ''}${outcomeMeta[o.id].enabled ? '' : ' disabled'}" title="${esc(outcomeMeta[o.id].enabled ? '' : outcomeMeta[o.id].title)}" onclick="setDecisionOutcome('${o.id}')">
          <div class="dec-outcome-title">${esc(o.title)}</div>
          <div class="dec-outcome-desc">${esc(o.desc)}</div>
          <div class="dec-outcome-meta">${esc(String(outcomeMeta[o.id].count))} 项材料</div>
        </button>
      `).join('');

      const chips = BIZ_TAG_KEYS.map(k => `
        <button type="button" class="dec-chip${decisionDraft.bizTags.includes(k) ? ' on' : ''}" onclick="toggleBizTag('${k}')">${esc(t(k))}</button>
      `).join('');

      const selectedLabel = outcome === 'pending'
        ? t('dec_materials_pending')
        : (outcome === 'reject' ? t('dec_materials_reject') : t('dec_materials_return'));

      const issueRows = decisionDraft.issues.length
        ? decisionDraft.issues.map(issue => {
            const person = issue.person === 'comaker' ? 'comaker' : 'borrower';
            const personText = person === 'comaker' ? t('dec_person_comaker') : t('dec_person_borrower');
            const hasValue = !!(issue.value && String(issue.value).trim());
            const isImage = issue.kind === 'image' && issue.url;
            const valueCell = isImage
              ? `<span class="dec-issue-value is-image" title="${esc(issue.label)}">
                   <img class="dec-issue-preview" src="${esc(issue.url)}" alt="" onclick="openLightbox('${esc(issue.url)}')" />
                   <span class="dec-issue-value-caption">${esc(lang === 'zh' ? '证件图' : 'Doc')}</span>
                 </span>`
              : `<span class="dec-issue-value${hasValue ? '' : ' is-empty'}" title="${esc(hasValue ? issue.value : t('dec_value_empty'))}">${esc(hasValue ? issue.value : t('dec_value_empty'))}</span>`;
            return `
              <div class="dec-issue">
                <div class="dec-issue-row1">
                  <span class="dec-issue-person ${person}">${esc(personText)}</span>
                  <span class="dec-issue-title" title="${esc(issue.label)}">${esc(issue.label)}</span>
                  ${valueCell}
                  <button type="button" class="dec-issue-remove" onclick="removeDecisionIssue('${issue.key}')">${t('dec_remove')}</button>
                </div>
                <div class="dec-issue-row2">
                  <select aria-label="${esc(t('dec_reason'))}" onchange="updateIssueField('${issue.key}','reason',this.value)">
                    ${REASON_KEYS.map(k => `<option value="${k}"${issue.reason === k ? ' selected' : ''}>${esc(t(k))}</option>`).join('')}
                  </select>
                  <input type="text" value="${esc(issue.remark || '')}" placeholder="${esc(t('dec_remark_ph'))}" aria-label="${esc(t('dec_remark'))}" oninput="updateIssueField('${issue.key}','remark',this.value)" />
                </div>
              </div>
            `;
          }).join('')
        : `<p class="empty-hint" style="padding:8px 0">${esc(t('dec_selected_empty'))}</p>`;

      const muteBlock = outcome === 'reject' ? `
        <div class="dec-section">
          <div class="dec-toggle-row">
            <div>
              <div class="dec-label" style="margin:0">${esc(t('dec_mute'))}</div>
              <div class="dec-label-hint">${esc(t('dec_mute_hint'))}</div>
            </div>
            <button type="button" class="dec-switch${decisionDraft.muteExempt ? ' on' : ''}" onclick="toggleMuteExempt()" aria-pressed="${decisionDraft.muteExempt}"></button>
          </div>
        </div>
      ` : '';

      document.getElementById('decision-modal-body').innerHTML = `
        <div class="dec-section">
          <div class="dec-label">${esc(t('dec_outcome'))}</div>
          <p class="dec-section-hint">${esc(t('dec_outcome_hint'))}</p>
          <div class="dec-outcome-row">${outcomeCards}</div>
        </div>
        <div class="dec-section">
          <div class="dec-label">${esc(t('dec_biz'))}</div>
          <div class="dec-chips">${chips}</div>
        </div>
        <div class="dec-section">
          <div class="dec-label">${esc(selectedLabel)}</div>
          <p class="dec-section-hint">${esc(t('dec_materials_hint'))}</p>
          <div class="dec-issue-list">${issueRows}</div>
        </div>
        ${muteBlock}
      `;
    }

    function confirmDecisionModal() {
      if (!decisionDraft) return;
      const { userId, outcome, issues, bizTags, muteExempt } = decisionDraft;
      if (!outcome) { showToast(t('dec_need_outcome')); return; }
      if ((outcome === 'return' || outcome === 'pending') && !issues.length) {
        showToast(t('dec_need_materials'));
        return;
      }
      const materialNotes = issues.map(i => `${i.label}: ${t(i.reason)}${i.remark ? ` (${i.remark})` : ''}`).join('; ');
      const composedNote = [
        bizTags.length ? `Biz: ${bizTags.map(k => t(k)).join(', ')}` : '',
        materialNotes,
        outcome === 'reject' && muteExempt ? (lang === 'zh' ? '禁言豁免: 是' : 'Mute exemption: yes') : '',
      ].filter(Boolean).join('\n');

      if (outcome === 'reject' && !issues.length) {
        showToast(t('dec_need_reject_note'));
        return;
      }

      const marked = [...new Set(issues.map(i => i.fieldKey).filter(Boolean))];
      closeDecisionModal();
      applyReviewDecision(userId, outcome, marked, composedNote);
    }

    function reviewDecision(userId, action) {
      const user = getUser(userId);
      if (!user || isPendingHoldActive(user)) return;
      if (!materialsAuditComplete(user)) {
        showToast(t('rv_gate_materials_incomplete'));
        return;
      }
      if (action === 'pass') {
        if (!canSubmitPass(user)) {
          showToast(passBlockReason(user));
          return;
        }
        applyReviewDecision(userId, 'pass', [], '');
        return;
      }
      if (action === 'return' && !canSubmitReturn(user)) {
        showToast(returnBlockReason(user));
        return;
      }
      if (action === 'reject' && !canSubmitReject(user)) {
        showToast(rejectBlockReason(user));
        return;
      }
      if (action === 'pending' && !canSubmitPending(user)) {
        showToast(pendingBlockReason(user));
        return;
      }
      openDecisionModal(userId, action);
    }

    function applyReviewDecision(userId, action, markedKeys, note) {
      const u = getUser(userId);
      if (!u) return;

      let marked = markedKeys?.length ? markedKeys : collectMarkedFieldKeys(userId, markWantForOutcome(action));
      if ((action === 'return' || action === 'pending') && !marked.length) {
        marked = u.flow === 'oversea'
          ? ['employer_phone', 'proof_income']
          : ['employer_phone', 'flight'];
      }

      const ac = auditCases.find(c => c.userId === userId);
      if (action === 'pass') {
        u.statusCode = 'DISBURSED';
        u.listingStatus = 'passed';
        u.returnFields = [];
        u.pendingFields = [];
        u.pendingReviewer = '';
        if (ac) ac.auditStatus = 'done';
        alert(t('alert_approved'));
      } else if (action === 'reject') {
        u.statusCode = 'LOAN_REJECTED';
        u.listingStatus = 'failed';
        u.returnFields = [];
        u.pendingFields = [];
        u.reviewNote = note;
        if (ac) ac.auditStatus = 'done';
        alert(t('alert_rejected'));
      } else if (action === 'return') {
        u.statusCode = 'MANUAL_RETURNED';
        u.listingStatus = 'failed';
        marked = applyIssuedFieldClear(u, marked, 'return');
        u.pendingFields = [];
        u.reviewNote = note;
        u.reviewReturnAt = new Date().toISOString().slice(0, 19).replace('T', ' ');
        if (ac) ac.auditStatus = 'returned';
        notifySalesForUser(u, 'return');
        alert(t('alert_returned') + '\n' + (lang === 'zh' ? '标红字段：' : 'Fields: ') + marked.join(', '));
      } else if (action === 'pending') {
        u.statusCode = 'MANUAL_PENDING';
        u.listingStatus = 'reviewing';
        marked = applyIssuedFieldClear(u, marked, 'pending');
        u.returnFields = [];
        u.reviewNote = note;
        u.pendingReviewer = (ac && ac.auditOwner) || 'zenaida';
        setPendingHold(u);
        if (ac) ac.auditStatus = 'pending_hold';
        notifySalesForUser(u, 'pending');
        alert(t('alert_pending') + '\n' + notifySalesOrMgmt(u) + '\n' + (lang === 'zh' ? '标红字段：' : 'Fields: ') + marked.join(', '));
      }
      goList();
    }


    function render() {
      menu = currentMenu();
      if (!(view === 'detail' && menu === 'review' && selectedUserId && isPendingHoldActive(getUser(selectedUserId)))) {
        clearPendingTick();
      }
      renderNav();
      renderNotifBell();
      renderNotifToasts();
      const info = getMenus()[menu];
      const titles = {
        list: [info.label, info.sub],
        detail: [`${info.label} · ${t('detail_suffix')}`, esc(getUser(selectedUserId)?.name || '')],
      };
      const tt = titles[view] || titles.list;
      document.getElementById('page-title').textContent = tt[0];
      document.getElementById('page-sub').textContent = tt[1];

      document.getElementById('content').innerHTML =
        view === 'detail' ? renderUserDetail() : (menu === 'review' ? renderReviewList() : renderUserList());
    }

    render();

    document.addEventListener('click', () => closeNotifPanel());
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (notifOpen) closeNotifPanel();
      else if (document.getElementById('decision-modal')?.classList.contains('open')) closeDecisionModal();
      else if (document.getElementById('rebind-modal')?.classList.contains('open')) closeRebindModal();
      else if (document.getElementById('edit-modal')?.classList.contains('open')) closeEditModal();
      else closeLightbox();
    });
  </script>

  <style>
    .back-btn {
      border: none; background: none; color: var(--brand); font-size: 13px;
      cursor: pointer; margin-bottom: 12px; padding: 0;
    }
    .alert {
      padding: 10px 14px; border-radius: var(--radius); font-size: 13px;
      margin-bottom: 12px; line-height: 1.5; border: 1px solid var(--border);
    }
    .alert-ok { background: var(--success-bg); color: #389e0d; border-color: #b7eb8f; }
    .alert-lock { background: var(--warning-bg); color: #d48806; border-color: #ffe58f; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 12px; background: var(--surface); }
    .tab {
      padding: 10px 20px; border: none; background: none; font-size: 13px;
      color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; background: var(--surface); }

    .info-block {
      background: var(--surface); border: 1px solid var(--border);
      margin-bottom: 12px; overflow: hidden;
    }
    .info-block-title {
      background: var(--section-head); text-align: center; font-weight: 600;

    }
    .comaker-block-title { justify-content: space-between; text-align: left; }
    .summary-hint {
      padding: 8px 14px; font-size: 12px; color: var(--text-muted);

    .tag-warning { background: var(--warning-bg); color: #d48806; border-color: #ffe58f; }
    .tag-danger { background: var(--danger-bg); color: #cf1322; border-color: #ffa39e; }
    .tag-info { background: var(--info-bg); color: var(--brand); border-color: #91d5ff; }
    .phase-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 2px; background: #fff; color: var(--text-muted); border: 1px solid var(--border); }
    .comaker-inner { border-top: 1px solid var(--border); }
    .comaker-inner.selected { background: var(--brand-light); }

      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 10px 14px; background: var(--label-bg); border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .comaker-badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

      font-size: 12px; color: #d48806; padding: 8px 14px;
      background: #fff; border-bottom: 1px solid var(--border);
    }
    .selected-tag { font-size: 10px; font-weight: 600; color: var(--brand); padding: 2px 6px; background: #fff; border: 1px solid var(--brand); border-radius: 2px; }
    .empty-hint { font-size: 13px; color: var(--text-muted); }
    .empty-tag { font-size: 10px; color: var(--warning); font-weight: 600; }
    .file-field { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; flex-wrap: wrap; }
    .file-field-img { flex-direction: column; align-items: flex-start; }
    .file-empty { color: var(--text-muted); font-style: italic; font-size: 13px; }
    .file-ok { color: var(--success); }
    .img-thumb-btn {
      border: none; background: none; padding: 0; cursor: zoom-in; position: relative; display: block;
    }
    .field-thumb {
      width: 140px; height: 96px; object-fit: cover; border-radius: 2px;
      border: 1px solid var(--border); display: block; background: var(--label-bg);
    }
    .img-zoom-hint {
      display: block; font-size: 11px; color: var(--brand); margin-top: 4px;
    }

    }

      font-size: 24px; cursor: pointer; line-height: 1;
    }
    .btn-sm {
      padding: 4px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      background: #fff; font-size: 12px; cursor: pointer; height: 28px;
    }
    .btn-sm.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .empty-state {
      padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px;
      background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px;
    }
    .save-bar {
      position: fixed; bottom: 0; right: 0; left: 220px;
      padding: 10px 20px; background: var(--surface); border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; box-shadow: 0 -2px 8px rgba(0,0,0,.06);
    }
    .btn-primary {
      padding: 10px 24px; background: var(--brand); color: #fff; border: none;
      border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .timeline { list-style: none; font-size: 13px; }

      padding: 8px 0 8px 20px; border-left: 2px solid var(--border);
      margin-left: 6px; color: var(--text-muted);
    }
    .timeline li.done { border-left-color: var(--brand); color: var(--text); }
    .review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }

    }

    .review-actions {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-top: 16px;
    }
    .review-actions textarea {
      width: 100%; padding: 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; margin-bottom: 12px; resize: vertical;
    }
    .action-row { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-danger {
      padding: 10px 20px; background: var(--danger); color: #fff; border: none;
      border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-success {
      padding: 10px 20px; background: var(--success); color: #fff; border: none;
      border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .copy-row { display: flex; gap: 8px; }
    .copy-row input {
      flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: relative; height: auto; }
      .save-bar { left: 0; }
    }
