<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kidlat Peso — Admin Console Prototype</title>
  <style>
    :root {
      --brand: #1890ff; --brand-light: #e6f4ff; --bg: #f0f2f5; --surface: #fff;
      --text: #303133; --text-muted: #909399; --border: #ebeef5; --label-bg: #f5f7fa;
      --section-head: #eef1f6;
      --success: #52c41a; --success-bg: #f6ffed;
      --warning: #faad14; --warning-bg: #fffbe6;
      --danger: #ff4d4f; --danger-bg: #fff2f0;
      --info: #1890ff; --info-bg: #e6f4ff;
      --radius: 2px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 13px; }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar {
      background: #fff; color: var(--text); padding: 0;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      border-right: 1px solid var(--border); box-shadow: 2px 0 8px rgba(0,0,0,.04);
    }
    .sidebar-brand {
      padding: 16px 20px; font-size: 15px; font-weight: 600; color: var(--brand);
      border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
    }
    .sidebar-brand::before { content: ''; width: 28px; height: 28px; border-radius: 6px; background: var(--brand); }
    .sidebar-inner { padding: 12px 10px; }
    .sidebar .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; padding: 0 6px; }
    .role-block { margin-bottom: 12px; padding: 0 6px; }
    .role-block label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; }
    .role-block select {
      width: 100%; padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--border);
      background: #fff; color: var(--text); font-size: 13px;
    }
    .nav-link {
      display: block; width: 100%; text-align: left; padding: 10px 14px; margin-bottom: 2px;
      border: none; border-radius: var(--radius); background: transparent; color: var(--text);
      font-size: 13px; cursor: pointer;
    }
    .nav-link:hover { background: var(--brand-light); color: var(--brand); }
    .nav-link.active { background: var(--brand-light); color: var(--brand); font-weight: 600; }
    .perm-hint {
      margin: 12px 6px 0; padding: 10px 12px; background: var(--label-bg); border-radius: var(--radius);
      font-size: 11px; line-height: 1.5; color: var(--text-muted); border: 1px solid var(--border);
    }
    .perm-hint strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 12px; }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 20px; height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }
    .topbar h2 { font-size: 15px; font-weight: 500; }
    .topbar .meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .content { padding: 16px 20px 24px; flex: 1; }
    .breadcrumb { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .breadcrumb a, .breadcrumb button { color: var(--brand); background: none; border: none; cursor: pointer; font-size: 12px; padding: 0; }
    .breadcrumb span { margin: 0 6px; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand" id="sidebar-brand">Kidlat Peso 后台</div>
      <div class="sidebar-inner">
        <p class="sub" id="sidebar-sub">角色演示 · 各角色仅见对应菜单</p>
        <div class="role-block">
          <label id="role-label">当前角色</label>
          <select id="role-select" onchange="setRole(this.value)">
            <option value="team_b" selected>Team B · 销售代填</option>
            <option value="team_mgmt">Team B · 销售代填管理</option>
            <option value="reviewer">人审 · 普通审核员</option>
            <option value="review_admin">人审 · 管理员</option>
          </select>
        </div>
        <nav id="nav"></nav>
        <div class="perm-hint" id="perm-hint"></div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div>
          <h2 id="page-title">Users</h2>
          <div class="meta" id="page-sub">Search and manage borrower profiles</div>
        </div>
        <div class="topbar-right">
          <div class="notif-wrap" id="notif-wrap"></div>
          <div class="lang-switch" id="lang-switch"></div>
          <span class="topbar-user" id="role-badge"></span>
        </div>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Preview" onclick="event.stopPropagation()" />
    <button type="button" class="lightbox-close" onclick="closeLightbox()">×</button>
  </div>

  <div id="edit-modal" class="modal" onclick="if(event.target===this)closeEditModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h3 id="edit-modal-title"></h3>
        <button type="button" class="modal-x" onclick="closeEditModal()">×</button>
      </div>
      <div class="modal-body" id="edit-modal-body"></div>
      <div class="modal-foot">
        <button type="button" class="btn-sm" id="edit-modal-cancel" onclick="closeEditModal()">取消</button>
        <button type="button" class="btn-sm primary" id="edit-modal-ok" onclick="confirmEditModal()">确定</button>
      </div>
    </div>
  </div>

  <div id="rebind-modal" class="modal" onclick="if(event.target===this)closeRebindModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h3 id="rebind-modal-title">换绑</h3>
        <button type="button" class="modal-x" onclick="closeRebindModal()">×</button>
      </div>
      <div class="modal-body" id="rebind-modal-body"></div>
      <div class="modal-foot">
        <button type="button" class="btn-sm" id="rebind-modal-cancel" onclick="closeRebindModal()">取消</button>
        <button type="button" class="btn-sm primary" id="rebind-modal-ok" onclick="confirmRebindModal()">确定</button>
      </div>
    </div>
  </div>

  <div id="decision-modal" class="modal" onclick="if(event.target===this)closeDecisionModal()">
    <div class="modal-card decision-card" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h3 id="decision-modal-title">人审结论</h3>
        <button type="button" class="modal-x" onclick="closeDecisionModal()">×</button>
      </div>
      <div class="modal-body" id="decision-modal-body"></div>
      <div class="modal-foot">
        <button type="button" class="btn-sm" onclick="closeDecisionModal()" id="decision-modal-cancel">取消</button>
        <button type="button" class="btn-sm primary" onclick="confirmDecisionModal()" id="decision-modal-ok">确认提交</button>
      </div>
    </div>
  </div>

  <style>
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
    .toolbar input, .toolbar select {
      padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; background: var(--surface); height: 32px;
    }
    .toolbar input { min-width: 220px; }
    .card { background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
    .table-wrap { overflow-x: auto; }
    .list-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1100px; }
    .list-table th, .list-table td {
      padding: 10px 12px; text-align: center; border: 1px solid var(--border);
    }
    .list-table th { background: var(--label-bg); font-weight: 600; font-size: 12px; color: var(--text); }
    .list-table tbody tr:hover td { background: var(--brand-light); }
    .list-table td.name-cell { text-align: left; }
    .topbar-user {
      font-size: 12px; padding: 4px 12px; border-radius: 12px;
      background: var(--brand-light); color: var(--brand); font-weight: 500;
    }
    .notif-wrap { position: relative; }
    .notif-btn {
      position: relative; width: 32px; height: 32px; border: 1px solid var(--border);
      border-radius: 50%; background: #fff; cursor: pointer; color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1;
    }
    .notif-btn:hover { border-color: var(--brand); color: var(--brand); }
    .notif-btn.open { border-color: var(--brand); color: var(--brand); background: var(--brand-light); }
    .notif-badge {
      position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .notif-panel {
      display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 9500;
      width: min(400px, calc(100vw - 40px)); background: #fff; border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.14); overflow: hidden;
    }
    .notif-panel.open { display: block; }
    .notif-panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--label-bg);
    }
    .notif-panel-head strong { font-size: 13px; }
    .notif-panel-head button {
      border: none; background: none; color: var(--brand); font-size: 12px; cursor: pointer; padding: 0;
    }
    .notif-list { max-height: 420px; overflow-y: auto; padding: 10px; background: #fafafa; }
    .notif-empty { padding: 28px 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

    /* Ant Design–style notice card (title / UserID / time / 查看) */
    .notif-card {
      position: relative; display: grid; grid-template-columns: 24px 1fr; gap: 10px 12px;
      background: #fff; border-radius: 8px; padding: 14px 16px 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12);
      border: 1px solid #f0f0f0; text-align: left; width: 100%;
    }
    .notif-list .notif-card { margin-bottom: 10px; }
    .notif-list .notif-card:last-child { margin-bottom: 0; }
    .notif-card.unread { box-shadow: 0 6px 16px rgba(24,144,255,.12), 0 3px 6px -4px rgba(0,0,0,.08); border-color: #91caff; }
    .notif-card-icon {
      width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
      font-style: italic; line-height: 1; margin-top: 1px;
    }
    .notif-card-main { min-width: 0; }
    .notif-card-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px;
    }
    .notif-card-title {
      font-size: 14px; font-weight: 600; color: rgba(0,0,0,.88); line-height: 1.4; padding-right: 8px;
    }
    .notif-card-x {
      border: none; background: none; color: rgba(0,0,0,.45); font-size: 16px; line-height: 1;
      cursor: pointer; padding: 0 2px; flex-shrink: 0;
    }
    .notif-card-x:hover { color: rgba(0,0,0,.88); }
    .notif-card-lines { font-size: 13px; color: rgba(0,0,0,.65); line-height: 1.7; margin-bottom: 8px; }
    .notif-card-foot { display: flex; justify-content: flex-end; }
    .notif-card-view {
      border: none; background: none; color: var(--brand); font-size: 13px; cursor: pointer; padding: 0;
    }
    .notif-card-view:hover { color: #40a9ff; }

    .notif-toast-stack {
      position: fixed; top: 24px; right: 24px; z-index: 12000;
      display: flex; flex-direction: column; gap: 12px; width: min(384px, calc(100vw - 32px));
      pointer-events: none;
    }
    .notif-toast-stack .notif-card { pointer-events: auto; animation: notifIn .22s ease-out; }
    @keyframes notifIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ui-toast-stack {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
      z-index: 13000; display: flex; flex-direction: column; gap: 8px; align-items: center;
      pointer-events: none; width: min(520px, calc(100vw - 32px));
    }
    .ui-toast {
      pointer-events: none; background: rgba(0,0,0,.78); color: #fff;
      padding: 10px 18px; border-radius: 6px; font-size: 14px; line-height: 1.5;
      text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,.18);
      animation: toastIn .18s ease-out;
    }
    .ui-toast.warn { background: rgba(0,0,0,.78); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .lang-switch {
      display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .lang-btn {
      border: none; background: #fff; padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--text-muted);
    }
    .lang-btn + .lang-btn { border-left: 1px solid var(--border); }
    .lang-btn.on { background: var(--brand); color: #fff; font-weight: 600; }
    .modal {
      display: none; position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,.45); align-items: center; justify-content: center; padding: 24px;
    }
    .modal.open { display: flex; }
    .modal-card {
      background: #fff; width: min(440px, 100%); border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18); overflow: hidden;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .modal-head h3 { font-size: 15px; font-weight: 600; }
    .modal-x {
      border: none; background: none; font-size: 20px; cursor: pointer; color: var(--text-muted); line-height: 1;
    }
    .modal-body { padding: 20px 16px; }
    .modal-body label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .modal-body .kv-input, .modal-body input, .modal-body select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px;
    }
    .modal-foot {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .form-row {
      display: flex; align-items: center; gap: 12px;
    }
    .form-row .form-label {
      flex: 0 0 88px; text-align: right; margin: 0; font-size: 13px; color: var(--text);
    }
    .form-row .form-label .req { color: var(--danger); margin-right: 2px; }
    .form-row .form-control { flex: 1; min-width: 0; }
    .action-links { display: inline-flex; gap: 12px; align-items: center; white-space: nowrap; }
    .action-links a, .action-links button.link-btn {
      border: none; background: none; padding: 0; color: var(--brand);
      font-size: 13px; cursor: pointer; text-decoration: none;
    }
    .action-links a:hover, .action-links button.link-btn:hover { color: #40a9ff; }
    .review-toolbar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 12px;
    }
    .review-toolbar-left { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .review-toolbar-left select, .review-toolbar-left input,
    .review-claim-bar input {
      padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; background: var(--surface); height: 32px;
    }
    .review-claim-bar { display: flex; gap: 8px; align-items: center; }
    .review-claim-bar input { width: 160px; }
    .review-list-table { min-width: 980px; }
    .review-list-table .link-id { color: var(--brand); text-decoration: none; }
    .review-list-table .link-id:hover { text-decoration: underline; }
    .review-pager {
      margin: 10px 0 16px; font-size: 12px; color: var(--text-muted);
    }
    .review-assign-bar {
      display: flex; gap: 10px; align-items: center; margin-bottom: 16px;
      padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
    }
    .review-assign-bar .assign-select {
      min-width: 220px; padding: 7px 12px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 13px; height: 32px;
    }
    .btn-assign {
      padding: 6px 20px; background: #fa8c16; color: #fff; border: none;
      border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; height: 32px;
    }
    .btn-assign:hover { background: #ffa940; }
    .review-stats-wrap { margin-bottom: 16px; }
    .review-stats-table { min-width: 640px; }
    .rv-breadcrumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .rv-section { margin-bottom: 12px; }
    .rv-module { margin-bottom: 16px; overflow: hidden; }
    .rv-module > .rv-module-title {
      background: #1f2937; color: #fff; text-align: left; justify-content: flex-start;
      font-size: 14px; padding: 12px 16px;
    }
    .rv-module-body { background: #fff; }
    .rv-sub { border-top: 1px solid var(--border); }
    .rv-sub:first-child { border-top: none; }
    .rv-sub-title {
      font-size: 13px; font-weight: 600; color: var(--text);
      padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid var(--border);
    }
    .rv-sub-body { padding: 0; }
    .rv-sub-body .rv-grid { border: none; }
    .rv-sub-body .table-wrap { margin: 0; }
    .rv-sub-stack { display: flex; flex-direction: column; gap: 0; }
    .rv-sub-stack .rv-stack-label {
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      padding: 10px 16px 6px; background: #fff;
    }
    .rv-sub-stack .audit-grid { padding: 8px 12px 12px; }
    .rv-sub-stack .table-wrap { padding: 0 12px 12px; }
    .rv-grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .rv-grid th, .rv-grid td { border: 1px solid var(--border); padding: 8px 10px; font-size: 13px; vertical-align: middle; }
    .rv-label { width: 12.5%; background: var(--label-bg); color: var(--text-muted); font-weight: 500; text-align: right; }
    .rv-value { width: 12.5%; background: #fff; word-break: break-word; }
    .rv-value .rv-val-text { display: block; margin-bottom: 6px; }
    .rv-mark-btns { display: flex; flex-wrap: wrap; gap: 4px; }
    .rv-mark-btn {
      border: 1px solid var(--border); background: #fff; color: var(--text-muted);
      border-radius: 4px; font-size: 11px; padding: 2px 6px; cursor: pointer; line-height: 1.4;
    }
    .rv-mark-btn:hover { border-color: var(--brand); color: var(--brand); }
    .rv-mark-btn.on.pass { background: var(--success-bg); border-color: #b7eb8f; color: #389e0d; font-weight: 600; }
    .rv-mark-btn.on.return { background: #fffbeb; border-color: #f59e0b; color: #b45309; font-weight: 600; }
    .rv-mark-btn.on.pending { background: #eef2ff; border-color: #6366f1; color: #4338ca; font-weight: 600; }
    .rv-mark-btn.on.reject { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); font-weight: 600; }
    .audit-card.return-on { border-color: #f59e0b; }
    .audit-card.pending-on { border-color: #6366f1; }
    .audit-card.reject-on { border-color: var(--danger); }
    .btn-suggest.return { border-color: #f59e0b; color: #b45309; background: #fffbeb; }
    .btn-suggest.pending { border-color: #6366f1; color: #4338ca; background: #eef2ff; }
    .btn-suggest.reject { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
    .rv-highlight { color: var(--danger); font-weight: 600; }
    .kv-flagged { background: #fff7ed !important; outline: 1px solid #fdba74; }
    .kv-flagged-label { color: #c2410c !important; font-weight: 600; background: #ffedd5 !important; }
    .list-row-attention { background: #fff7ed; }
    .list-row-attention:hover { background: #ffedd5; }
    .list-row-attention td { border-bottom-color: #fed7aa; }
    .rv-pad { background: var(--label-bg); }
    .rv-dial-table { min-width: 800px; }
    .rv-link-btn {
      border: none; background: none; color: var(--brand); font-size: 12px; cursor: pointer; padding: 0;
    }
    .rv-link-btn:hover { text-decoration: underline; }
    .audit-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px; padding: 16px;
    }
    .audit-card {
      border: 1px solid var(--border); background: #fff; display: flex; flex-direction: column;
    }
    .audit-card-title {
      padding: 8px 10px; background: var(--label-bg); font-size: 12px; font-weight: 600;
      border-bottom: 1px solid var(--border); text-align: center;
    }
    .audit-card-img { padding: 10px; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 120px; }
    .audit-thumb { width: 100%; max-width: 180px; height: 110px; object-fit: cover; border: 1px solid var(--border); }
    .audit-thumb.placeholder {
      width: 100%; max-width: 180px; height: 110px; display: flex; align-items: center; justify-content: center;
      background: var(--label-bg); color: var(--text-muted); font-size: 11px; word-break: break-all; padding: 8px;
    }
    .audit-card-actions { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .audit-btn {
      flex: 1; min-width: 70px; padding: 5px 8px; border: 1px solid var(--brand); background: #fff;
      color: var(--brand); font-size: 11px; cursor: pointer; border-radius: 2px;
    }

    function isReviewAdmin() { return !!ROLES[role]?.isReviewAdmin; }

      return menu === 'sales-fill' || menu === 'sales-fill-mgmt';

    function currentSalesRepId() {
      return 'sarah_lim';
    }

    function isUnassignedSales(u) {
      const r = String(u.salesRep || '').trim();
      return !r || r === '—' || r.toLowerCase() === 'unassigned';
    }

    function isManualAttentionStatus(code) {
      return code === 'MANUAL_RETURNED' || code === 'MANUAL_PENDING';
    }

    /** Sales default queue: 终审填资 / 人审退回 / Pending / 待担保确认 */
    const SALES_DEFAULT_STATUS_CODES = new Set([
      'PRE_APPROVED', 'MANUAL_RETURNED', 'MANUAL_PENDING', 'LOAN_COMAKER_CONFIRM',
    ]);

    function isSalesDefaultStatus(code) {
      return SALES_DEFAULT_STATUS_CODES.has(code);
    }

    function listAttentionRank(u) {
      const c = userStatus(u);
      if (c === 'MANUAL_RETURNED') return 0;
      if (c === 'MANUAL_PENDING') return 1;
      if (c === 'PRE_APPROVED') return 2;
      if (c === 'LOAN_COMAKER_CONFIRM') return 3;
      return 4;
    }

    function salesRepDisplay(u) {
      return isUnassignedSales(u) ? t('sales_unassigned') : (u.salesRep || '—');
    }

    function nowStamp() {
      return new Date().toISOString().slice(0, 19).replace('T', ' ');
    }

    function fmtNotifBody(key, user) {
      return t(key)
        .replace('{name}', user?.name || '—')
        .replace('{id}', user?.id || '—');
    }

    function isNotifVisibleToMe(n) {
      return visibleNotifications().some(x => x.id === n.id);
    }

    function pushNotification({ audience, to, userId, type, titleKey, bodyKey, at }) {
      const n = {
        id: `N${notifSeq++}`,
        audience,
        to: to || '',
        userId,
        type,
        titleKey,
        bodyKey,
        at: at || nowStamp(),
        read: false,
      };
      notifications.unshift(n);
      if (notifReady && isNotifVisibleToMe(n)) showNotifToast(n);
      return n;
    }

    function notifySalesForUser(user, type) {
      if (!user) return;
      const isReturn = type === 'return';
      const titleKey = isReturn ? 'notif_return_title' : 'notif_pending_sales_title';
      const bodyKey = isReturn ? 'notif_return_body' : 'notif_pending_sales_body';
      if (isUnassignedSales(user)) {
        pushNotification({ audience: 'mgmt', userId: user.id, type, titleKey, bodyKey });
      } else {
        pushNotification({
          audience: 'sales', to: user.salesRep, userId: user.id, type, titleKey, bodyKey,
        });
      }
    }

    function notifyReviewerForUser(user, type) {
      if (!user) return;
      const reviewer = user.pendingReviewer
        || auditCases.find(c => c.userId === user.id)?.auditOwner
        || currentAuditorId();
      const titleKey = type === 'return_resubmit' ? 'notif_return_resubmit_title' : 'notif_user_fixed_title';
      const bodyKey = type === 'return_resubmit' ? 'notif_return_resubmit_body' : 'notif_user_fixed_body';
      pushNotification({
        audience: 'reviewer', to: reviewer, userId: user.id, type: type || 'user_fixed',
        titleKey, bodyKey,
      });
    }

    function visibleNotifications() {
      if (role === 'team_b') {
        const me = currentSalesRepId();
        return notifications.filter(n => n.audience === 'sales' && (!n.to || n.to === me));
      }
      if (role === 'team_mgmt') {
        return notifications.filter(n =>
          n.audience === 'mgmt'
          || n.audience === 'sales'
        );
      }
      if (role === 'reviewer' || role === 'review_admin') {
        const me = currentAuditorId();
        return notifications.filter(n =>
          n.audience === 'reviewer' && (role === 'review_admin' || !n.to || n.to === me)
        );
      }
      return [];
    }

    function unreadNotifCount() {
      return visibleNotifications().filter(n => !n.read).length;
    }

    /** Lightweight top-center toast (validation / gate hints). */
    function showToast(message, ms = 2800) {
      const stack = document.getElementById('ui-toast-stack');
      if (!stack || !message) return;
      const el = document.createElement('div');
      el.className = 'ui-toast warn';
      el.textContent = String(message);
      stack.appendChild(el);
      const remove = () => {
        el.style.opacity = '0';
        el.style.transition = 'opacity .18s ease';
        setTimeout(() => el.remove(), 200);
      };
      setTimeout(remove, ms);
    }

    function toggleNotifPanel(e) {
      e?.stopPropagation?.();
      notifOpen = !notifOpen;
      renderNotifBell();
    }

    function closeNotifPanel() {
      if (!notifOpen) return;
      notifOpen = false;
      renderNotifBell();
    }

    function markAllNotifsRead() {
      visibleNotifications().forEach(n => { n.read = true; });
      renderNotifBell();
      renderNotifToasts();
    }

    function dismissNotif(notifId, e) {
      e?.stopPropagation?.();
      const n = notifications.find(x => x.id === notifId);
      if (n) n.read = true;
      toastNotifIds = toastNotifIds.filter(id => id !== notifId);
      renderNotifBell();
      renderNotifToasts();
    }

    function openFromNotification(notifId, e) {
      e?.stopPropagation?.();
      const n = notifications.find(x => x.id === notifId);
      if (!n) return;
      n.read = true;
      notifOpen = false;
      toastNotifIds = toastNotifIds.filter(id => id !== notifId);
      renderNotifToasts();
      const u = getUser(n.userId);
      if (!u) { renderNotifBell(); return; }

      if (role === 'reviewer' || role === 'review_admin') {
        let ac = auditCases.find(c => c.userId === u.id);
        if (!ac) {
          auditCases.unshift({
            caseId: `ACN${u.id}`, userId: u.id, appliedAt: nowStamp(),
            auditStatus: 'pending', auditOwner: currentAuditorId(), lastCallAt: null, touched: true,
          });
        } else if (!ac.auditOwner) {
          ac.auditOwner = currentAuditorId();
          if (ac.auditStatus === 'unassigned') ac.auditStatus = 'pending';
        }
      }
      openUser(u.id);
    }

    function notifCardHtml(n, { toast = false } = {}) {
      const u = getUser(n.userId);
      const uid = u?.id || n.userId || '—';
      const time = n.at || '—';
      const closeFn = toast
        ? `dismissNotifToast('${n.id}', event)`
        : `dismissNotif('${n.id}', event)`;
      return `<div class="notif-card${n.read ? '' : ' unread'}" data-id="${esc(n.id)}">
        <div class="notif-card-icon" aria-hidden="true">i</div>
        <div class="notif-card-main">
          <div class="notif-card-head">
            <div class="notif-card-title">${esc(t(n.titleKey))}</div>
            <button type="button" class="notif-card-x" onclick="${closeFn}" aria-label="Close">×</button>
          </div>
          <div class="notif-card-lines">
            <div>${esc(t('notif_userid').replace('{id}', uid))}</div>
            <div>${esc(t('notif_time').replace('{time}', time))}</div>
          </div>
          <div class="notif-card-foot">
            <button type="button" class="notif-card-view" onclick="openFromNotification('${n.id}', event)">${esc(t('notif_view'))}</button>
          </div>
        </div>
      </div>`;
    }

    function showNotifToast(n) {
      if (!n?.id) return;
      toastNotifIds = [n.id, ...toastNotifIds.filter(id => id !== n.id)].slice(0, 4);
      renderNotifToasts();
      renderNotifBell();
    }

    function dismissNotifToast(notifId, e) {
      e?.stopPropagation?.();
      toastNotifIds = toastNotifIds.filter(id => id !== notifId);
      const n = notifications.find(x => x.id === notifId);
      if (n) n.read = true;
      renderNotifToasts();
      renderNotifBell();
    }

    function renderNotifToasts() {
      const stack = document.getElementById('notif-toast-stack');
      if (!stack) return;
      const cards = toastNotifIds
        .map(id => notifications.find(n => n.id === id))
        .filter(n => n && isNotifVisibleToMe(n) && !n.read);
      toastNotifIds = cards.map(n => n.id);
      stack.innerHTML = cards.map(n => notifCardHtml(n, { toast: true })).join('');
    }

    function renderNotifBell() {
      const list = visibleNotifications();
      const unread = list.filter(n => !n.read).length;
      const items = list.length
        ? list.map(n => notifCardHtml(n)).join('')
        : `<div class="notif-empty">${esc(t('notif_empty'))}</div>`;

      document.getElementById('notif-wrap').innerHTML = `
        <button type="button" class="notif-btn${notifOpen ? ' open' : ''}" onclick="toggleNotifPanel(event)" title="${esc(t('notif_title'))}" aria-label="${esc(t('notif_title'))}">
          🔔${unread ? `<span class="notif-badge">${unread > 99 ? '99+' : unread}</span>` : ''}
        </button>
        <div class="notif-panel${notifOpen ? ' open' : ''}" onclick="event.stopPropagation()">
          <div class="notif-panel-head">
            <strong>${esc(t('notif_title'))}</strong>
            ${unread ? `<button type="button" onclick="markAllNotifsRead()">${esc(t('notif_mark_all'))}</button>` : '<span></span>'}
          </div>
          <div class="notif-list">${items}</div>
        </div>
      `;
    }

    /** F09：退回 / Pending 下发时整组清空。 */
    function returnClearGroups(flow) {
      const common = [
        ['oec', 'oec_duration'],
        ['payroll', 'expected_payday'],
        ['cm_residential', 'cm_province', 'cm_city', 'cm_barangay', 'cm_complete', 'cm_validation_type', 'cm_validation'],
        ['cm_full_rel', 'cm_rel_cert_type', 'cm_rel_cert'],
      ];
      if (flow === 'oversea') {
        return common.concat([
          ['residence_doc_type', 'valid_visa', 'visa_issue', 'visa_expiry'],
          ['c1_residential', 'c1_province', 'c1_city', 'c1_barangay', 'c1_complete'],
          ['c2_residential', 'c2_province', 'c2_city', 'c2_barangay', 'c2_complete'],
        ]);
      }
      return common.concat([
        ['valid_visa', 'visa_expiry'],
        ['flight', 'departure_date'],
        ['ph_residential', 'ph_province', 'ph_city', 'ph_barangay', 'ph_address'],
      ]);
    }

    function expandReturnClearKeys(keys, flow) {
      const set = new Set((keys || []).map(k => normalizeSalesAddrFlagKey(k)).filter(Boolean));
      const groups = returnClearGroups(flow);
      let changed = true;
      while (changed) {
        changed = false;
        groups.forEach(g => {
          if (!g.some(k => set.has(k))) return;
          g.forEach(k => {
            if (!set.has(k)) {
              set.add(k);
              changed = true;
            }
          });
        });
      }
      return [...set];
    }

    function clearIssuedFields(user, keys) {
      if (!user) return;
      const f = user.fields || (user.fields = {});
      const cm = (user.comakers || []).find(c => c.id === user.selectedComakerId)
        || (user.comakers || [])[0];
      (keys || []).forEach(k => {
        if (String(k).startsWith('cm_')) {
          if (!cm) return;
          if (!cm.fields) cm.fields = {};
          cm.fields[k] = '';
        } else {
          f[k] = '';
        }
      });
    }

    function applyIssuedFieldClear(user, keys, kind) {
      const expanded = expandReturnClearKeys(keys, user.flow);
      clearIssuedFields(user, expanded);
      if (kind === 'pending') user.pendingFields = expanded;
      else user.returnFields = expanded;
      return expanded;
    }

    function isFieldKeyEditable(user, key, dataObj, cmId) {
      if (!isSalesAssistMenu() || !ROLES[role].canEdit) return false;
      if (key === 'mobile') return false;
      const code = userStatus(user);
      const pendingHas = (k) => (user.pendingFields || []).some(pk => normalizeSalesAddrFlagKey(pk) === k);

      // Co-maker fields follow comaker edit rules (not borrower lock)
      if (String(key).startsWith('cm_')) {
        if (key === 'cm_phone') return false;
        if (isSalesMgmtMenu() && isBeforeFinalSubmit(user)) return true;
        if (code === 'MANUAL_PENDING') {
          return isSalesMgmtMenu() && pendingHas(key);
        }
        if (!canEditComakers(user)) return false;
        if (cmId) {
          const cm = (user.comakers || []).find(c => c.id === cmId);
          if (cm && isActiveComakerLocked(user, cm)) return false;
        }
        return canEditThisField(key, user);
      }

      if (isSalesMgmtMenu() && isBeforeFinalSubmit(user)) return true;
      if (!canEditThisField(key, user)) return false;
      if (code === 'MANUAL_PENDING') {
        return pendingHas(key);
      }
      return canTeamBEditBorrower(user);
    }

      if (code === 'LOAN_COMAKER_CONFIRM' && user.selectedComakerId && cm.id === user.selectedComakerId) {

      return false;

    function normalizeMark(v) {
      if (v === 'pass' || v === 'match') return 'pass';
      if (v === 'return' || v === 'nomatch') return 'return';
      if (v === 'pending') return 'pending';
      if (v === 'reject') return 'reject';
      return null;
    }

    function auditCheck(userId, key, value) {
      if (!reviewAuditState[userId]) reviewAuditState[userId] = {};
      // Co-maker phone is display-only in review — cannot Return / Pending / Reject.
      if (key === 'cm_phone') return;
      const next = normalizeMark(value);
      const cur = normalizeMark(reviewAuditState[userId][key]);
      if (!next) return;
      // Pass is only for image materials — text fields use Return / Pending / Reject only.
      if (next === 'pass') {
        const u = getUser(userId);
        if (u && !getImageFieldKeys(u).includes(key)) return;
      }
      if (cur === next) delete reviewAuditState[userId][key];
      else reviewAuditState[userId][key] = next;
      render();
      if (decisionDraft?.userId === userId && document.getElementById('decision-modal')?.classList.contains('open')) {
        renderDecisionModal();
      }
    }

    function countFieldMarks(userId) {
      const s = reviewAuditState[userId] || {};
      let passed = 0, returned = 0, pending = 0, rejected = 0;
      Object.values(s).forEach(v => {
        const m = normalizeMark(v);
        if (m === 'pass') passed += 1;
        else if (m === 'return') returned += 1;
        else if (m === 'pending') pending += 1;
        else if (m === 'reject') rejected += 1;
      });
      return { passed, returned, pending, rejected, issues: returned + pending + rejected };
    }

      keys.forEach(k => {
        const m = normalizeMark(s[k]);
        if (m === 'pass') passed += 1;
        else if (m === 'return') returned += 1;
        else if (m === 'pending') pending += 1;
        else if (m === 'reject') rejected += 1;
        else idle += 1;
      });
      return { passed, returned, pending, rejected, idle, total: keys.length, marked: keys.length - idle };
    }

    /** Must-pass Materials：每张证件须有 Pass / Return / Pending / Reject 之一。 */
    function materialsAuditComplete(user) {
      if (!user) return false;
      const img = imageAuditProgress(user);
      return img.total > 0 && img.idle === 0;
    }

    function canSubmitPass(user) {
      if (!user || isPendingHoldActive(user)) return false;
      if (!materialsAuditComplete(user)) return false;
      const img = imageAuditProgress(user);
      const marks = countFieldMarks(user.id);
      return img.passed === img.total
        && marks.returned === 0
        && marks.pending === 0
        && marks.rejected === 0;
    }

    function canSubmitReturn(user) {
      if (!user || isPendingHoldActive(user)) return false;
      if (!materialsAuditComplete(user)) return false;
      return countFieldMarks(user.id).returned > 0;
    }

    function canSubmitReject(user) {
      if (!user || isPendingHoldActive(user)) return false;
      if (!materialsAuditComplete(user)) return false;
      return countFieldMarks(user.id).rejected > 0;
    }

    function canSubmitPending(user) {
      if (!user || isPendingHoldActive(user)) return false;
      if (!materialsAuditComplete(user)) return false;
      const marks = countFieldMarks(user.id);
      return marks.pending > 0 && marks.returned === 0 && marks.rejected === 0;
    }

    function passBlockReason(user) {
      if (!materialsAuditComplete(user)) return t('rv_gate_materials_incomplete');
      const img = imageAuditProgress(user);
      const marks = countFieldMarks(user.id);
      if (marks.returned > 0 || marks.pending > 0 || marks.rejected > 0) return t('rv_gate_has_issue');
      if (img.passed < img.total) return t('rv_pass_need_all');
      return t('rv_gate_need_pass');
    }

    function returnBlockReason(user) {
      if (!materialsAuditComplete(user)) return t('rv_gate_materials_incomplete');
      return t('rv_gate_need_return');
    }

    function rejectBlockReason(user) {
      if (!materialsAuditComplete(user)) return t('rv_gate_materials_incomplete');
      return t('rv_gate_need_reject');
    }

    function pendingBlockReason(user) {
      if (!materialsAuditComplete(user)) return t('rv_gate_materials_incomplete');
      const marks = countFieldMarks(user.id);
      if (marks.returned > 0 || marks.rejected > 0) return t('rv_gate_has_return');
      return t('rv_gate_need_pending');
    }

    function auditProgress(userId, total) {
      const c = countFieldMarks(userId);
      const marked = c.passed + c.returned + c.pending + c.rejected;
      const idle = Math.max(0, total - marked);
      return { passed: c.passed, rejected: c.returned, pending: c.pending, denied: c.rejected, idle, total };
    }

    function getPendingFieldKeySet(user) {
      return new Set(getPendingDecisionItems(user).map(i => i.fieldKey).filter(Boolean));
    }

    function markWantForOutcome(outcome) {
      if (outcome === 'pending') return 'pending';
      if (outcome === 'reject') return 'reject';
      return 'return';
    }

    /** requirePass: image cards only — text fields only get Return / Pending / Reject. */
    function renderMarkButtons(userId, fieldKey, allowPending, opts = {}) {
      if (!fieldKey) return '';
      // Co-maker phone: visible in review but not markable (cannot return / pending / reject).
      if (fieldKey === 'cm_phone') return '';
      const requirePass = !!opts.requirePass;
      const state = normalizeMark(reviewAuditState[userId]?.[fieldKey]);
      const pendingBtn = allowPending
        ? `<button type="button" class="rv-mark-btn pending${state === 'pending' ? ' on' : ''}" onclick="auditCheck('${userId}','${fieldKey}','pending')">${t('rv_mark_pending')}</button>`
        : '';
      const passBtn = requirePass
        ? `<button type="button" class="rv-mark-btn pass${state === 'pass' ? ' on' : ''}" onclick="auditCheck('${userId}','${fieldKey}','pass')">${t('rv_pass')}</button>`
        : '';
      return `<div class="rv-mark-btns">
        ${passBtn}
        <button type="button" class="rv-mark-btn return${state === 'return' ? ' on' : ''}" onclick="auditCheck('${userId}','${fieldKey}','return')">${t('rv_reject')}</button>
        ${pendingBtn}
        <button type="button" class="rv-mark-btn reject${state === 'reject' ? ' on' : ''}" onclick="auditCheck('${userId}','${fieldKey}','reject')">${t('rv_mark_reject')}</button>
      </div>`;
    }

    function rf(label, value, fieldKey, tip, extra) {
      return { label, value, fieldKey, tip, ...(extra || {}) };
    }

    function rfMeta(label, value, tip, extra) {
      return { label, value, tip, ...(extra || {}) };
    }

    function setPendingHold(user) {
      if (!user) return;
      user.pendingUntil = new Date(Date.now() + PENDING_HOLD_MS).toISOString();
    }

    function isPendingHoldActive(user) {
      if (!user || userStatus(user) !== 'MANUAL_PENDING') return false;
      if (!user.pendingUntil) setPendingHold(user);
      return Date.now() < new Date(user.pendingUntil).getTime();
    }

    function formatPendingCountdown(untilIso) {
      const ms = Math.max(0, new Date(untilIso).getTime() - Date.now());
      const d = Math.floor(ms / 86400000);
      const h = Math.floor((ms % 86400000) / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const pad = n => String(n).padStart(2, '0');
      return lang === 'zh'
        ? `${d}天 ${pad(h)}:${pad(m)}:${pad(s)}`
        : `${d}d ${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function releasePendingHold(userId) {
      const u = getUser(userId);
      if (!u || userStatus(u) !== 'MANUAL_PENDING') return;
      const reviewer = u.pendingReviewer || currentAuditorId();
      u.statusCode = 'LOAN_REVIEWING';
      u.listingStatus = 'reviewing';
      u.pendingFields = [];
      u.pendingUntil = '';
      const ac = auditCases.find(c => c.userId === userId);
      if (ac) { ac.auditStatus = 'pending'; ac.auditOwner = reviewer; }
      clearPendingTick();
      render();
    }

    function clearPendingTick() {
      if (pendingTickTimer) {
        clearInterval(pendingTickTimer);
        pendingTickTimer = null;
      }
    }

    function ensurePendingTick(userId) {
      clearPendingTick();
      pendingTickTimer = setInterval(() => {
        const u = getUser(userId);
        if (!u || view !== 'detail' || selectedUserId !== userId || menu !== 'review') {
          clearPendingTick();
          return;
        }
        if (userStatus(u) !== 'MANUAL_PENDING') {
          clearPendingTick();
          return;
        }
        if (!isPendingHoldActive(u)) {
          releasePendingHold(userId);
          return;
        }
        const el = document.getElementById('pending-countdown');
        if (el && u.pendingUntil) el.textContent = formatPendingCountdown(u.pendingUntil);
      }, 1000);
    }

    function renderReviewGrid(fields, userId) {
      const pendingKeys = userId ? getPendingFieldKeySet(getUser(userId)) : new Set();
      let html = '<table class="rv-grid"><tbody>';
      for (let i = 0; i < fields.length; i += 4) {
        html += '<tr>';
        for (let j = 0; j < 4; j++) {
          const f = fields[i + j];
          if (f) {
            const val = f.link
              ? `<a href="#" class="link-id" onclick="event.preventDefault()">${esc(f.value)}</a>`
              : (f.highlight
                ? `<span class="rv-highlight">${esc(f.value || '—')}</span>`
                : esc(f.value || '—'));
            const marks = userId && f.fieldKey
              ? renderMarkButtons(userId, f.fieldKey, pendingKeys.has(f.fieldKey), { requirePass: false })
              : '';
            html += `<th class="rv-label">${esc(f.label)}${fieldTipMark(f.tip)}</th><td class="rv-value"><span class="rv-val-text">${val}</span>${marks}</td>`;
          } else {
            html += '<th class="rv-label rv-pad"></th><td class="rv-value rv-pad"></td>';
          }
        }
        html += '</tr>';
      }
      return html + '</tbody></table>';
    }

    function renderDialTable(rows) {
      const head = `<tr>
        <th>${t('name')}</th><th>${t('rv_relationship')}</th><th>${t('rv_phone')}</th>
        <th>${t('rv_last_code')}</th><th>${t('rv_dial')}</th><th>${t('rv_code_record')}</th>
      </tr>`;
      const body = rows.map(r => {
        const code = reviewCallCodes[r.key] || '—';
        return `<tr>
          <td>${esc(r.name)}</td>
          <td>${esc(r.rel)}</td>
          <td>${esc(r.phone)}</td>
          <td>${esc(code)}</td>
          <td><button type="button" class="rv-link-btn" onclick="alert('${lang==='zh'?'拨打（原型）':'Dial (prototype)'}')">📞 ${t('rv_dial')}</button></td>
          <td><button type="button" class="rv-link-btn" onclick="reviewCallCodes['${r.key}']=prompt('Code','')||reviewCallCodes['${r.key}'];render()">✎ ${t('rv_code_record')}</button></td>
        </tr>`;
      }).join('');
      return `<div class="table-wrap"><table class="list-table rv-dial-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
    }

    function renderAuditCard(item, userId) {
      const fieldKey = item.fieldKey || AUDIT_FIELD_MAP[item.key] || item.key;
      const state = normalizeMark(reviewAuditState[userId]?.[fieldKey]);
      const pendingKeys = getPendingFieldKeySet(getUser(userId));
      const allowPending = pendingKeys.has(fieldKey);
      const cardClass = state === 'pass' ? ' pass-on'
        : (state === 'return' ? ' return-on'
          : (state === 'pending' ? ' pending-on'
            : (state === 'reject' ? ' reject-on' : '')));
      const btns = renderMarkButtons(userId, fieldKey, allowPending, { requirePass: true });
      const img = item.url
        ? `<button type="button" class="img-thumb-btn" onclick="openLightbox('${esc(item.url)}')"><img class="audit-thumb" src="${esc(item.url)}" alt="" /></button>`
        : `<div class="audit-thumb placeholder">${esc(item.placeholder || '—')}</div>`;
      return `<div class="audit-card${cardClass}">
        <div class="audit-card-title">${esc(item.label)}${fieldTipMark(item.tip)}</div>
        <div class="audit-card-img">${img}</div>
        <div class="audit-card-actions">${btns}</div>
      </div>`;
    }

    function renderAuditGrid(title, items, userId) {
      return renderReviewSection(title,
        `<div class="audit-grid">${items.map(it => renderAuditCard(it, userId)).join('')}</div>`);
    }

    function filteredUsers() {
      const isMgmt = isSalesMgmtMenu();
      const me = currentSalesRepId();
      const qRaw = (listFilter.q || '').trim();
      const qNorm = qRaw.toLowerCase().replace(/\s+/g, '');
      const statusFilter = listFilter.profileStatus || '';

      const matchQ = (u) => {
        if (!qNorm) return true;
        const mobile = String(u.mobile || '').replace(/\s+/g, '').toLowerCase();
        return mobile.includes(qNorm)
          || String(u.id || '').toLowerCase().includes(qNorm)
          || (u.name && u.name.toLowerCase().includes(qRaw.toLowerCase()));
      };

      const matchStatus = (st) => {
        if (!statusFilter || statusFilter === '__ALL__') return true;
        return st === statusFilter;
      };

      let list = users.filter(u => {
        if (listFilter.flow && u.flow !== listFilter.flow) return false;
        if (listFilter.salesRep && isMgmt && u.salesRep !== listFilter.salesRep) return false;

        const st = userStatus(u);

        if (isMgmt) {
          if (qRaw) return matchQ(u) && matchStatus(st);
          if (statusFilter === '__ALL__') return true;
          if (statusFilter) return st === statusFilter;
          return isManualAttentionStatus(st);
        }

        // sales · team_b
        if (qRaw) {
          if (!matchQ(u)) return false;
          if (!(u.salesRep === me || isUnassignedSales(u))) return false;
          return matchStatus(st);
        }
        if (u.salesRep !== me) return false;
        if (statusFilter === '__ALL__') return true;
        if (statusFilter) return st === statusFilter;
        return isSalesDefaultStatus(st);
      });

      list = list.slice().sort((a, b) => {
        const pa = listAttentionRank(a);
        const pb = listAttentionRank(b);
        if (pa !== pb) return pa - pb;
        return String(b.registeredAt || '').localeCompare(String(a.registeredAt || ''));
      });
      return list;
    }

    function listUsers() {
      return filteredUsers();

    function reviewListCases() {
      const me = currentAuditorId();
      return auditCases.filter(c => {
        const u = getUser(c.userId);
        if (!u) return false;
        if (reviewFilter.q) {
          const q = reviewFilter.q.toLowerCase();
          if (!u.id.toLowerCase().includes(q) && !(u.name && u.name.toLowerCase().includes(q))) return false;
        }
        if (isReviewAdmin()) {
          if (reviewFilter.owner === '__unassigned__') return c.auditStatus === 'unassigned';
          if (reviewFilter.owner) return c.auditOwner === reviewFilter.owner;
          return ['unassigned', 'pending', 'pending_hold'].includes(c.auditStatus);
        }
        return c.auditOwner === me && ['pending', 'pending_hold'].includes(c.auditStatus);
      });
    }

    function auditorStatsRows() {
      return AUDITORS.map((a, i) => {
        const mine = auditCases.filter(c => c.auditOwner === a.id && c.auditStatus === 'pending');
        return {
          rank: i + 1,
          name: a.name,
          id: a.id,
          cases: mine.length,
          doneToday: a.doneToday,
          untouched: mine.filter(c => !c.touched).length,
        };
      }).sort((a, b) => b.cases - a.cases).map((r, i) => ({ ...r, rank: i + 1 }));
    }

    function toggleReviewSelect(caseId, checked) {
      if (checked) reviewSelected.add(caseId);
      else reviewSelected.delete(caseId);
      render();
    }

    function toggleReviewSelectAll(checked) {
      reviewListCases().forEach(c => {
        if (checked) reviewSelected.add(c.caseId);
        else reviewSelected.delete(c.caseId);
      });
      render();
    }

    function claimReviewCases() {
      const n = Math.min(10, Math.max(1, parseInt(reviewClaimCount, 10) || 1));
      const pool = auditCases.filter(c => c.auditStatus === 'unassigned');
      if (!pool.length) { alert(t('review_claim_none')); return; }
      const me = currentAuditorId();
      pool.slice(0, n).forEach(c => {
        c.auditStatus = 'pending';
        c.auditOwner = me;
        c.touched = false;
      });
      alert(t('review_claim_ok').replace('{n}', String(Math.min(n, pool.length))));
      render();
    }

    function assignReviewOwner() {
      if (!isReviewAdmin()) return;
      const target = reviewAssignTarget;
      if (!target || !reviewSelected.size) { alert(t('review_assign_need')); return; }
      let n = 0;
      auditCases.forEach(c => {
        if (!reviewSelected.has(c.caseId)) return;
        if (c.auditStatus !== 'unassigned' && c.auditStatus !== 'pending') return;
        c.auditOwner = target;
        c.auditStatus = 'pending';
        c.touched = false;
        n++;
      });
      reviewSelected.clear();
      alert(t('review_assign_ok').replace('{n}', String(n)));
      render();
    }

        </select>` : `
        <select disabled title="${esc(auditorName(me))}">
          <option>${esc(auditorName(me))}(${list.length})</option>

        const chk = admin ? `<td onclick="event.stopPropagation()"><input type="checkbox"${reviewSelected.has(c.caseId)?' checked':''} onchange="toggleReviewSelect('${c.caseId}',this.checked)" /></td>` : '';

          <button type="button" class="link-btn" onclick="openUser('${u.id}')">${t('btn_edit')}</button>
        </div>`;
      }
      return `<button type="button" class="btn-sm primary" onclick="event.stopPropagation();openUser('${u.id}')">${t('btn_edit')}</button>`;

            ${Object.keys(USER_STATUS_META).map(k => {
              const v = usMeta(k);
              return `<option value="${k}"${listFilter.profileStatus===k?' selected':''}>${esc(v.label)}${v.action ? ' — ' + esc(v.action) : ''}</option>`;

          <table class="list-table">
