<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SahodNow — Backend</title>
  <style>
    :root {
      --brand: #1890ff; --brand-light: #e6f4ff; --bg: #f0f2f5; --surface: #fff;
      --text: #303133; --text-muted: #909399; --border: #ebeef5; --label-bg: #f5f7fa;
      --success: #52c41a; --warning: #faad14; --danger: #ff4d4f;
      --radius: 2px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --sidebar-sub-bg: #f5f5f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 13px; }
    button, input, select, textarea { font: inherit; }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar {
      background: #fff; border-right: 1px solid var(--border);
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      box-shadow: 2px 0 8px rgba(0,0,0,.04);
    }
    .sidebar-brand {
      padding: 16px 20px; font-size: 15px; font-weight: 600; color: var(--brand);
      border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
    }
    .sidebar-brand::before {
      content: ''; width: 28px; height: 28px; border-radius: 6px; background: var(--brand);
    }
    .sidebar-inner { padding: 8px 0 16px; }
    .nav-group { margin-bottom: 2px; }
    .nav-group-hd {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border: none; background: transparent; color: var(--text);
      font-size: 14px; cursor: pointer; text-align: left;
    }
    .nav-group-hd:hover { color: var(--brand); }
    .nav-group-hd .ico { width: 18px; height: 18px; flex-shrink: 0; color: #595959; }
    .nav-group-hd:hover .ico { color: var(--brand); }
    .nav-group-hd .label { flex: 1; }
    .nav-group-hd .chev {
      width: 12px; height: 12px; color: #bfbfbf; transition: transform .15s;
      transform: rotate(0deg);
    }
    .nav-group.open .nav-group-hd .chev { transform: rotate(180deg); }
    .nav-group-bd {
      display: none; background: var(--sidebar-sub-bg); padding: 4px 0 8px;
    }
    .nav-group.open .nav-group-bd { display: block; }
    .nav-link {
      display: block; width: 100%; text-align: left; border: none; background: transparent;
      padding: 10px 16px 10px 44px; font-size: 13px; color: var(--text); cursor: pointer;
    }
    .nav-link:hover { color: var(--brand); }
    .nav-link.active { color: var(--brand); font-weight: 500; }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 20px; height: 50px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }
    .topbar h2 { font-size: 15px; font-weight: 500; }
    .topbar .meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .topbar-user {
      font-size: 12px; padding: 4px 12px; border-radius: 12px;
      background: var(--brand-light); color: var(--brand); font-weight: 500;
    }
    .content { padding: 16px 20px 32px; flex: 1; }
    .breadcrumb { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .breadcrumb button { color: var(--brand); background: none; border: none; cursor: pointer; font-size: 12px; padding: 0; }
    .breadcrumb span { margin: 0 6px; }
    .card { background: var(--surface); border: 1px solid var(--border); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
    .toolbar input, .toolbar select, .field input, .field select, .field textarea {
      padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; background: #fff; height: 32px;
    }
    .toolbar input { min-width: 200px; }
    .field textarea { height: auto; min-height: 72px; width: 100%; }
    .btn {
      height: 32px; padding: 0 16px; border: 1px solid var(--border); border-radius: var(--radius);
      background: #fff; cursor: pointer; font-size: 13px; color: var(--text);
    }
    .btn:hover { border-color: var(--brand); color: var(--brand); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.primary:hover { background: #40a9ff; border-color: #40a9ff; color: #fff; }
    .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn.warn { background: #fa8c16; border-color: #fa8c16; color: #fff; }
    .table-wrap { overflow-x: auto; }
    table.list { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
    table.list th, table.list td {
      padding: 10px 12px; border: 1px solid var(--border); text-align: center;
    }
    table.list th { background: var(--label-bg); font-weight: 600; font-size: 12px; }
    table.list tbody tr:hover td { background: var(--brand-light); }
    table.list td.left { text-align: left; }
    .link { border: none; background: none; color: var(--brand); cursor: pointer; padding: 0; font-size: 13px; }
    .link:hover { color: #40a9ff; }
    .tag {
      display: inline-block; padding: 1px 8px; border-radius: 2px; font-size: 12px; line-height: 20px;
      border: 1px solid transparent;
    }
    .tag.info { color: var(--brand); background: var(--brand-light); border-color: #91caff; }
    .tag.ok { color: #389e0d; background: #f6ffed; border-color: #b7eb8f; }
    .tag.warn { color: #d48806; background: #fffbe6; border-color: #ffe58f; }
    .tag.bad { color: #cf1322; background: #fff1f0; border-color: #ffa39e; }
    .section { margin-bottom: 12px; }
    .section-hd {
      background: #1f2937; color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 600;
    }
    .section-bd { background: #fff; border: 1px solid var(--border); border-top: none; padding: 16px; }
    .kv-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px;
    }
    .kv-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kv dt { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .kv dd { font-size: 13px; color: var(--text); word-break: break-word; }
    .img-row { display: flex; flex-wrap: wrap; gap: 12px; }
    .img-thumb {
      width: 120px; height: 80px; border: 1px solid var(--border); background: var(--label-bg);
      display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px;
      cursor: pointer;
    }
    .form-grid { display: grid; grid-template-columns: 120px 1fr; gap: 12px; max-width: 640px; align-items: center; }
    .form-grid label { text-align: right; color: var(--text); }
    .form-grid .ctrl { min-width: 0; }
    .form-grid .ctrl input, .form-grid .ctrl select, .form-grid .ctrl textarea { width: 100%; }
    .form-actions { margin-top: 16px; display: flex; gap: 8px; padding-left: 132px; }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    .toast-stack {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 9999;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      background: rgba(0,0,0,.78); color: #fff; padding: 10px 18px; border-radius: 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,.18);
    }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .tab {
      border: none; background: none; padding: 10px 16px; cursor: pointer; color: var(--text-muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
    .switch { display: inline-flex; align-items: center; gap: 8px; }
    .switch input { width: 36px; height: 20px; }
    .config-table td.left { width: 36%; }
    .empty { padding: 40px; text-align: center; color: var(--text-muted); }
    .toolbar-end { margin-left: auto; }
    .thumb-mini {
      width: 48px; height: 32px; margin: 0 auto; border: 1px solid var(--border);
      background: var(--label-bg); display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 11px; cursor: pointer;
    }
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 2000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      width: 560px; max-width: 100%; background: #fff; border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18); overflow: hidden;
    }
    .modal-hd {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between;
    }
    .modal-hd .x { border: none; background: none; font-size: 18px; color: #999; cursor: pointer; line-height: 1; }
    .modal-bd { padding: 20px; max-height: min(70vh, 560px); overflow-y: auto; }
    .modal-ft {
      padding: 12px 20px; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .form-grid.top { align-items: start; }
    .form-grid.top > label { padding-top: 8px; }
    .radio-row { display: flex; gap: 24px; align-items: center; min-height: 32px; }
    .radio-row label {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      text-align: left; color: var(--text); font-size: 13px; margin: 0;
    }
    .radio-row input { width: 14px; height: 14px; accent-color: var(--brand); }
    .upload-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .upload-item { width: 168px; }
    .upload-item .cap {
      font-size: 12px; color: var(--text); margin-bottom: 6px; font-weight: 500;
    }
    .upload-box {
      position: relative; width: 168px; height: 108px; border: 1px solid var(--border);
      border-radius: 4px; background: #f5f7fa; overflow: hidden; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .upload-box:hover { border-color: var(--brand); }
    .upload-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .upload-box .ph { color: var(--text-muted); font-size: 12px; }
    .upload-cam {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(114, 46, 209, .88); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.18); pointer-events: none;
    }
    .upload-cam svg { width: 18px; height: 18px; }
    .upload-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }
    .cs-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    .cs-preview {
      background: linear-gradient(165deg, #f0f7ff 0%, #fff 48%);
      border: 1px solid #91caff; border-radius: 8px; padding: 20px;
    }
    .cs-preview .badge {
      display: inline-block; font-size: 11px; color: var(--brand); background: #e6f4ff;
      border: 1px solid #91caff; border-radius: 2px; padding: 2px 8px; margin-bottom: 12px;
    }
    .cs-preview h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .cs-preview .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
    .cs-item {
      display: flex; gap: 12px; align-items: flex-start; padding: 12px 0;
      border-bottom: 1px solid #e8f0fa;
    }
    .cs-item:last-child { border-bottom: none; padding-bottom: 0; }
    .cs-ico {
      width: 36px; height: 36px; border-radius: 50%; background: #fff;
      border: 1px solid #91caff; color: var(--brand);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .cs-ico svg { width: 18px; height: 18px; }
    .cs-item .k { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
    .cs-item .v { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-all; white-space: pre-line; }
    .cs-item .v.empty { color: var(--warning); font-weight: 500; }
    .cs-channels { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .cs-channels span {
      font-size: 11px; padding: 3px 10px; border-radius: 12px;
      background: #f5f7fa; color: var(--text-muted); border: 1px solid var(--border);
    }
    .page-crumb { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
    .cancel-layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 14px; align-items: start; }
    .panel { background: #fff; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .panel-hd {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      font-size: 14px; font-weight: 600; background: #fafafa;
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-bd { padding: 16px; }
    .search-row { display: flex; gap: 8px; }
    .search-row input { flex: 1; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius); }
    .search-row .btn { height: 36px; }
    .check-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .check-item {
      display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 6px; background: #fafafa;
    }
    .check-item.pass { background: #f6ffed; border-color: #b7eb8f; }
    .check-item.fail { background: #fff1f0; border-color: #ffa39e; }
    .check-dot {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff;
    }
    .check-item.pass .check-dot { background: var(--success); }
    .check-item.fail .check-dot { background: var(--danger); }
    .check-item .t { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .check-item .d { font-size: 12px; color: var(--text-muted); line-height: 1.45; }
    .field-block { margin-bottom: 14px; }
    .field-block label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text); }
    .field-block label .req { color: var(--danger); margin-right: 2px; }
    .field-block input, .field-block select, .field-block textarea {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; background: #fff;
    }
    .field-block textarea { min-height: 88px; resize: vertical; }
    .cancel-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .guide {
      margin-top: 14px; background: #fff; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    .guide-hd {
      padding: 12px 16px; background: #f5f7fa; border-bottom: 1px solid var(--border);
      font-size: 14px; font-weight: 600;
    }
    .guide-bd { padding: 16px 18px 18px; }
    .guide-bd h4 { font-size: 13px; margin: 14px 0 8px; color: var(--text); }
    .guide-bd h4:first-child { margin-top: 0; }
    .guide-bd ol, .guide-bd ul { padding-left: 18px; color: var(--text); font-size: 13px; line-height: 1.7; }
    .guide-bd li { margin-bottom: 4px; }
    .guide-bd .muted { color: var(--text-muted); font-size: 12px; margin-top: 10px; line-height: 1.6; }
    .user-mini {
      margin-top: 12px; padding: 12px; border: 1px dashed #91caff; border-radius: 6px; background: #e6f4ff;
      display: none;
    }
    .user-mini.show { display: block; }
    .user-mini .row { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; }
    .user-mini .row span { color: var(--text-muted); }
    .review-filters {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px;
    }
    .review-filters select, .review-filters input {
      height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius);
      background: #fff; font-size: 13px; min-width: 140px;
    }
    .review-filters input[type="number"] { width: 72px; min-width: 72px; text-align: center; }
    .review-filters .claim-box {
      margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 13px; color: var(--text);
    }
    .review-filters .claim-box label { color: var(--text); white-space: nowrap; }
    table.list.review-table { min-width: 1280px; }
    table.list.review-table th { white-space: nowrap; }
    table.list.review-table td.num { font-variant-numeric: tabular-nums; }
    .th-sort { color: var(--brand); }
    .th-sort::after { content: ' ▲'; font-size: 10px; }
    .th-sort.desc::after { content: ' ▼'; }
    .cert-sticky-bar {
      position: sticky; bottom: 0; margin: 16px -20px -32px; padding: 14px 20px;
      background: #fff; border-top: 1px solid var(--border);
      display: flex; gap: 10px; justify-content: flex-end; align-items: center;
      box-shadow: 0 -4px 12px rgba(0,0,0,.04);
    }
    .material-card {
      border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; overflow: hidden;
      background: #fff;
    }
    .material-card.focus { border-color: #91caff; box-shadow: 0 0 0 2px rgba(24,144,255,.12); }
    .material-card.verdict-pass { border-color: #b7eb8f; }
    .material-card.verdict-reject { border-color: #ffa39e; }
    .material-hd {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: #fafafa; border-bottom: 1px solid var(--border);
    }
    .material-hd .title { font-size: 14px; font-weight: 600; }
    .material-hd .code { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 8px; }
    .material-bd { padding: 14px 16px; }
    .verdict-btns { display: flex; gap: 8px; flex-shrink: 0; }
    .verdict-btns .btn.on-pass { background: #52c41a; border-color: #52c41a; color: #fff; }
    .verdict-btns .btn.on-reject { background: #ff4d4f; border-color: #ff4d4f; color: #fff; }
    .file-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
    .file-thumb {
      width: 140px; min-height: 96px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--label-bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px; cursor: pointer;
      color: var(--text-muted); font-size: 12px; padding: 10px; text-align: center;
    }
    .file-thumb:hover { border-color: var(--brand); color: var(--brand); }
    .file-thumb .ico { font-size: 28px; line-height: 1; }
    .reject-modal .modal { width: 720px; }
    .reject-block { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .reject-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .reject-block h4 { font-size: 13px; margin-bottom: 10px; }
    .tag-grid { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .tag-grid label {
      display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
      cursor: pointer; padding: 4px 0; color: var(--text);
    }
    .tag-grid input { width: 14px; height: 14px; accent-color: var(--brand); }
    .reject-remark { margin-top: 12px; }
    .reject-remark label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .reject-remark textarea {
      width: 100%; min-height: 64px; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 4px; font-size: 13px; resize: vertical; font-family: inherit; box-sizing: border-box;
    }
    .jh-reuse-banner {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px; margin-bottom: 14px;
      background: #fff7e6; border: 1px solid #ffd591; border-radius: 4px;
      color: #ad6800; font-size: 13px; line-height: 1.55;
    }
    .jh-reuse-banner strong { color: #d48806; }
    .listing-toolbar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px;
      margin-bottom: 12px; font-size: 13px;
    }
    .listing-toolbar .lab { color: var(--text); font-weight: 500; }
    .listing-table-wrap { overflow-x: auto; }
    .listing-table { min-width: 1280px; }
    .listing-table th, .listing-table td { white-space: nowrap; }
    .listing-expand {
      width: 28px; border: none; background: transparent; color: var(--text-muted);
      cursor: pointer; font-size: 12px; padding: 0 4px;
    }
    .cert-items-cell { line-height: 1.55; max-width: 420px; }
    .cert-items-cell .ci { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 8px;
      background: var(--label-bg); border-radius: 3px; font-size: 12px; color: var(--text); }
    @media (max-width: 960px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: relative; height: auto; }
      .kv-grid, .kv-grid.three, .cancel-layout, .cs-layout { grid-template-columns: 1fr; }
      .review-filters .claim-box { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">SahodNow 后台</div>
      <div class="sidebar-inner" id="nav"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div>
          <h2 id="page-title">页面</h2>
          <div class="meta" id="page-sub"></div>
        </div>
        <span class="topbar-user">运营 · Demo</span>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div class="toast-stack" id="toasts"></div>

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

function statusTag(u) {
  const map = {
    listing_review: 'info',
    active: 'ok',
    rejected: 'bad',
    disbursing: 'warn'
  };
  return `<span class="tag ${map[u.status] || 'info'}">${u.statusLabel}</span>`;
}

function findUser(id) {
  return USERS.find(u => u.id === id) || USERS[0];
}

function renderNav() {
  const root = document.getElementById('nav');
  root.innerHTML = MENU.map(g => {
    const open = state.openGroups[g.id] ? 'open' : '';
    const kids = g.children.map(c => `
      <button type="button" class="nav-link ${state.page === c.id || ((state.page === 'user-detail' || state.page === 'cert-detail') && state.detailFrom === c.id) ? 'active' : ''}"
        data-page="${c.id}">${c.title}</button>
    `).join('');
    return `
      <div class="nav-group ${open}" data-group="${g.id}">
        <button type="button" class="nav-group-hd" data-toggle="${g.id}">
          ${ICONS[g.icon]}
          <span class="label">${g.title}</span>
          ${ICONS.chev}
        </button>
        <div class="nav-group-bd">${kids}</div>
      </div>`;
  }).join('');

  root.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.toggle;
      state.openGroups[id] = !state.openGroups[id];
      renderNav();
    };
  });
  root.querySelectorAll('[data-page]').forEach(btn => {
    btn.onclick = () => go(btn.dataset.page);
  });
}

function go(page, opts = {}) {
  state.page = page;
  if (opts.userId) {
    if (state.detailUserId !== opts.userId) state.listingStatusFilter = '';
    state.detailUserId = opts.userId;
    state.detailFrom = opts.from || state.detailFrom;
  }
  if (opts.certItem !== undefined) state.certFocusItem = opts.certItem;
  if (page === 'cert-detail') {
    state.certVerdicts = {};
    state.detailFrom = 'cert-review';
  }
  if (page !== 'user-detail' && page !== 'cert-detail') {
    state.detailFrom = page;
    window.__filteredUsers = null;
  }
  renderNav();
  renderPage();
}

function setTitle(title, sub) {
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent = sub || '';
}

function fullName(u) {
  return [u.idInfo.firstName, u.idInfo.middleName, u.idInfo.lastName].filter(Boolean).join(' ');
}

function filterUsers() {
  const type = document.getElementById('q-type')?.value || 'userId';
  const raw = (document.getElementById('q')?.value || '').trim().toLowerCase();
  if (!raw) return USERS;
  return USERS.filter(u => {
    if (type === 'userId') return u.id.toLowerCase().includes(raw);
    if (type === 'phone') return u.phone.includes(raw) || u.maskPhone.toLowerCase().includes(raw);
    if (type === 'listingId') return (u.listingId || '').toLowerCase().includes(raw);
    if (type === 'idNumber') return u.idInfo.number.toLowerCase().includes(raw);
    if (type === 'idName') return fullName(u).toLowerCase().includes(raw);
    return true;
  });
}

        <option value="idName" ${type === 'idName' ? 'selected' : ''}>证件姓名</option>
      </select>
      <input id="q" placeholder="请输入" value="${q.replace(/"/g, '&quot;')}" />
      <button class="btn primary" type="button" onclick="runUserSearch('${sourcePage}')">搜索</button>

    <div class="card table-wrap">

        <thead>
          <tr>
            <th>User ID</th>
            <th>姓名</th>
            <th>注册手机</th>
            <th>证件类型</th>
            <th>证件号码</th>
            <th>注册时间</th>
            <th>用户等级</th>
          </tr>
        </thead>
        <tbody>

            </tr>`).join('') : '<tr><td colspan="7" class="empty">无匹配结果</td></tr>'}

      </table>
    </div>`;
}

function filteredReviewQueue() {
  const f = state.reviewFilter;
  let list = [...REVIEW_QUEUE];
  if (f.account) list = list.filter(r => r.underwriter === f.account);
  if (f.productType) list = list.filter(r => r.type === f.productType);
  if (f.rating) list = list.filter(r => r.rating === f.rating);
  if (f.tag) list = list.filter(r => r.tag === f.tag);
  if (f.filterType && f.filterValue.trim()) {
    const v = f.filterValue.trim().toLowerCase();
    list = list.filter(r => {
      if (f.filterType === 'listingId') return r.listingId.toLowerCase().includes(v);
      if (f.filterType === 'userId') return r.userId.toLowerCase().includes(v);
      if (f.filterType === 'underwriter') return r.underwriter.toLowerCase().includes(v);
      return true;
    });
  }
  list.sort((a, b) => {
    const cmp = a.actualAt.localeCompare(b.actualAt);
    return state.reviewSortAsc ? cmp : -cmp;
  });
  return list;
}

const CERT_REJECT_TAGS = [
  'Reject-Not himself',
  'Reject-Not the right file',
  "Reject-Can't recognize key infor",
  'Reject-Fake file',
  'Expired',
  'Suspicious information',
  'Missing key information'
];

function getCertMaterials(u) {
  return u.enhanceMaterials || [];
}

function materialVerdict(key) {
  return state.certVerdicts[key] || { status: '', reasons: [], remark: '' };
}

function setMaterialVerdict(key, status) {
  const prev = materialVerdict(key);
  state.certVerdicts[key] = {
    status,
    reasons: status === 'reject' ? (prev.reasons || []) : [],
    remark: status === 'reject' ? (prev.remark || '') : ''
  };
  renderPage();
}

function allMaterialsPassed(materials) {
  return materials.length > 0 && materials.every(m => materialVerdict(m.key).status === 'pass');
}

function rejectedMaterials(materials) {
  return materials.filter(m => materialVerdict(m.key).status === 'reject');
}

function suggestCertPass() {
  const u = findUser(state.detailUserId);
  const materials = getCertMaterials(u);
  if (!materials.length) {
    toast('无可审核材料');
    return;
  }
  const pending = materials.filter(m => !materialVerdict(m.key).status);
  if (pending.length) {
    toast(`还有 ${pending.length} 项未标记通过/拒绝`);
    return;
  }
  if (!allMaterialsPassed(materials)) {
    toast('建议通过要求：全部材料须为 Pass');
    return;
  }
  toast('已提交建议通过（原型）');
  go('cert-review');
}

function openCertRejectModal() {
  const u = findUser(state.detailUserId);
  const materials = getCertMaterials(u);
  const rejected = rejectedMaterials(materials);
  if (!rejected.length) {
    toast('请先将至少一项材料标记为拒绝');
    return;
  }
  const pending = materials.filter(m => !materialVerdict(m.key).status);
  if (pending.length) {
    toast(`还有 ${pending.length} 项未标记，请先完成单项判定`);
    return;
  }
  const body = rejected.map(m => {
    const v = materialVerdict(m.key);
    const checks = CERT_REJECT_TAGS.map(tag => {
      const checked = (v.reasons || []).includes(tag) ? 'checked' : '';
      const id = `rej-${m.key}-${tag.replace(/[^a-zA-Z0-9]/g, '_')}`;
      const safeTag = tag.replace(/"/g, '&quot;');
      return `<label for="${id}"><input type="checkbox" id="${id}" data-mat="${m.key}" data-tag="${safeTag}" ${checked} />${tag}</label>`;
    }).join('');
    const remarkVal = (v.remark || '').replace(/</g, '&lt;');
    return `
      <div class="reject-block" data-mat="${m.key}">
        <h4>${m.title} <span style="color:#909399;font-weight:400">· ${m.key}</span></h4>
        <div class="tag-grid">${checks}</div>
        <div class="reject-remark">
          <label for="rej-remark-${m.key}">备注</label>
          <textarea id="rej-remark-${m.key}" data-mat-remark="${m.key}" placeholder="请填写备注（选填）">${remarkVal}</textarea>
        </div>
      </div>`;
  }).join('');

  const wrap = document.createElement('div');
  wrap.id = 'cert-reject-modal';
  wrap.innerHTML = `
    <div class="modal-mask reject-modal" onclick="if(event.target===this)closeCertRejectModal()">
      <div class="modal">
        <div class="modal-hd">
          建议拒绝 · 标记拒绝原因
          <button type="button" class="x" onclick="closeCertRejectModal()">×</button>
        </div>
        <div class="modal-bd">
          <p class="hint" style="margin:0 0 14px">以下为当前已标记拒绝的材料，请为每项勾选拒绝原因（可多选），并可填写备注：</p>
          ${body}
        </div>
        <div class="modal-ft">
          <button type="button" class="btn" onclick="closeCertRejectModal()">取消</button>

function closeCertRejectModal() {
  document.getElementById('cert-reject-modal')?.remove();
}

function confirmCertReject() {
  const modal = document.getElementById('cert-reject-modal');
  if (!modal) return;
  const byMat = {};
  const remarks = {};
  modal.querySelectorAll('input[type=checkbox][data-mat]').forEach(el => {
    const key = el.dataset.mat;
    if (!byMat[key]) byMat[key] = [];
    if (el.checked) byMat[key].push(el.dataset.tag);
  });
  modal.querySelectorAll('textarea[data-mat-remark]').forEach(el => {
    remarks[el.dataset.matRemark] = (el.value || '').trim();
  });
  const missing = Object.keys(byMat).filter(k => !byMat[k].length);
  if (missing.length) {
    toast('每项已拒绝材料至少选择 1 个原因');
    return;
  }
  Object.keys(byMat).forEach(key => {
    state.certVerdicts[key] = {
      status: 'reject',
      reasons: byMat[key],
      remark: remarks[key] || ''
    };
  });
  closeCertRejectModal();
  toast('已提交建议拒绝（原型）');
  go('cert-review');
}

function pickDocTip(key) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/jpeg,image/png,.jpg,.jpeg,.png';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    if (!/^image\/(jpeg|png)$/i.test(file.type)) {
      toast('仅支持 jpg/png');
      return;
    }
    if (file.size > 200 * 1024) {
      toast('图片需 ≤ 200K');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      window.__docDraft[key] = reader.result;
      renderDocTipUploads();
      toast('已选择图片（原型）');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function saveDocModal(id) {
  const name = (document.getElementById('doc-name')?.value || '').trim();
  if (!name) { toast('请选择配置项目'); return; }
  const draft = window.__docDraft || {};
  const hasBack = document.querySelector('input[name="doc-back"]:checked')?.value === '1';
  if (!draft.tipFront) { toast('请上传证明提示图片'); return; }
  if (hasBack && !draft.tipBack) { toast('请上传反面提示图片'); return; }
  const payload = {
    name,
    recommend: document.querySelector('input[name="doc-recommend"]:checked')?.value === '1',
    tipFront: draft.tipFront || true,
    tipBack: hasBack ? (draft.tipBack || true) : '',
    hasBack,
    sort: Number(document.getElementById('doc-sort')?.value) || 1,
    enabled: document.querySelector('input[name="doc-enabled"]:checked')?.value === '1'
  };
  if (id) {
    const row = DOC_TYPES.find(d => d.id === id);
    if (row) Object.assign(row, payload);
    toast('已保存（原型）');
  } else {
    if (DOC_TYPES.some(d => d.name === name)) {
      toast('该证件类型已存在');
      return;
    }
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    DOC_TYPES.push({ id: slug || ('doc_' + Date.now()), ...payload });
    toast('已新增（原型）');
  }
  closeDocModal();
  renderPage();
}

function evaluateCancel(u) {
  const checks = [];
  const hasLoan = (u.credit?.used || 0) > 0;
  const overdue = !!u.overdue;
  const inFlight = u.status === 'listing_review' || u.status === 'disbursing' || !!u.listing;
  const retryWindow = !!u.disburseFailRetry;

  checks.push({
    ok: !hasLoan,
    title: '无在贷未结清借据',
    desc: hasLoan ? `当前 Used ₱${u.credit.used.toLocaleString()}，须结清后再注销` : '无占用额度 / 未结清借据'
  });
  checks.push({
    ok: !overdue,
    title: '无逾期账单',
    desc: overdue ? '存在逾期，须还清逾期后再注销' : '无逾期账期'
  });
  checks.push({
    ok: !inFlight,
    title: '无在途发标 / 放款单',
    desc: inFlight ? '存在发标审核中、放款中或未关单申请，不可注销' : '无在途借款申请'
  });
  checks.push({
    ok: !retryWindow,
    title: '无放款失败换卡窗口期内订单',
    desc: retryWindow ? '放款失败仍在换卡重试窗口内，须等关单或处理完毕' : '无换卡重试窗口占用'
  });

  return { ok: checks.every(c => c.ok), checks };
}

            ` : `<p class="hint">搜索用户后将自动展示硬性条件校验结果。</p>`}
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-hd">2. 填写并确认注销</div>
        <div class="panel-bd">
          <div class="field-block">
            <label><span class="req">*</span>注销原因</label>
            <select id="cancel-reason-type">
              <option value="">请选择</option>
              <option>用户主动申请</option>
              <option>隐私 / 合规要求</option>
              <option>重复注册清理</option>
              <option>欺诈 / 风控处置</option>
              <option>其他</option>
            </select>
          </div>
          <div class="field-block">
            <label><span class="req">*</span>客服备注</label>
            <textarea id="cancel-reason" placeholder="记录申请来源（邮件/热线）、核身方式、工单号等"></textarea>
          </div>

          <div class="cancel-actions">
            <button class="btn" type="button" onclick="window.__cancelUser=null;renderPage()">清空</button>
            <button class="btn danger" type="button" onclick="submitCancel()"
              ${u && evalResult && evalResult.ok ? '' : 'disabled style="opacity:.45;cursor:not-allowed"'}>
              确认注销
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="guide">
      <div class="guide-hd">使用说明 · 请客服谨慎注销</div>
      <div class="guide-bd">
        <h4>操作前必须确认</h4>
        <ul>
          <li>申请人确认为本人（核对注册手机、证件姓名，必要时回拨 / 核对申请邮件）。</li>
          <li>先点「搜索校验」，看清左侧硬性条件；有红色项时<strong>不得注销</strong>。</li>
          <li>向用户说明：销户后该手机号将无法再登录；如需再用须重新注册（是否允许同号复用以账号体系为准）。</li>
        </ul>

        <h4>硬性不可注销（任一命中即拦截）</h4>
        <ol>
          <li><strong>存在在贷未结清</strong>：Used &gt; 0 或仍有未结清借据 / 还款计划。</li>
          <li><strong>存在逾期账单</strong>：任一账期逾期未还清。</li>
          <li><strong>存在在途借款单</strong>：发标审核中、放款处理中，或放款失败仍在换卡重试窗口内未关单。</li>
          <li><strong>存在争议资金 / 支付挂账</strong>（若支付侧标记）：须先与资金 / 支付对齐后再处理。</li>
        </ol>

        <h4>可以注销的典型情形</h4>
        <ul>
          <li>从未借款，或借款已全部结清，且无在途申请、无逾期。</li>
          <li>仅完成部分 KYC / 未戳额，用户明确要求删除账号。</li>
          <li>合规 / 隐私删除请求，且债务与在途单据已结清。</li>
        </ul>

        <h4>建议操作步骤</h4>
        <ol>
          <li>用手机号或 User ID 搜索 → 核对姓名与证件。</li>
          <li>查看校验清单，全部为绿色后再填写原因与备注。</li>
          <li>填写原因与备注 → 点「确认注销」。</li>
          <li>销户完成后：清理会话；该号不可登录；如有站内信 / Push Token，按中台约定失效（一期可人工备注）。</li>
        </ol>
      </div>
    </div>`;
}

const CS_CONTACT = {

function saveCsContact() {
  const phone = (document.getElementById('cs-phone')?.value || '').trim();
  const email = (document.getElementById('cs-email')?.value || '').trim();
  const hours = (document.getElementById('cs-hours')?.value || '').trim();
  if (!phone && !email) { toast('请至少填写热线或邮箱'); return; }
  CS_CONTACT.phone = phone;
  CS_CONTACT.email = email;
  CS_CONTACT.hours = hours;
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  CS_CONTACT.updatedAt = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  CS_CONTACT.updatedBy = '运营 · Demo';
  toast('已保存，当前展示已更新（原型）');
  renderPage();
}

function resetCsContactForm() {
  document.getElementById('cs-phone').value = CS_CONTACT.phone || '';
  document.getElementById('cs-email').value = CS_CONTACT.email || '';
  document.getElementById('cs-hours').value = CS_CONTACT.hours || '';
  toast('已重置为当前生效值');
}
