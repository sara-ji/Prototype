<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SahodNow — Liveness Verification</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell no-nav">
    <div class="page-header">
      <button class="back-btn" id="btn-back" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#141413" stroke-width="1.5" fill="none"/></svg>
      </button>
      <div>
        <div id="step-label"></div>
        <h2>Liveness verification</h2>
      </div>
    </div>

    <div class="page-content face-auth-layout">
      <div id="progress-bar"></div>
      <div class="face-security-badge">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1.5L2.5 4v4c0 3.5 2.3 6.8 5.5 7.8 3.2-1 5.5-4.3 5.5-7.8V4L8 1.5z" stroke="#696969" stroke-width="1.2" fill="none"/>
          <path d="M6 8l1.5 1.5L10.5 6.5" stroke="#696969" stroke-width="1.2"/>
        </svg>
        <span>Encrypted transmission&nbsp;&nbsp;|&nbsp;&nbsp;For KYC identity verification only</span>
      </div>

      <div class="face-scan-zone">
        <div class="face-scan-circle" id="scan-circle">
          <svg class="face-silhouette" id="face-silhouette" viewBox="0 0 88 88" fill="none">
            <circle cx="44" cy="32" r="16" fill="#141413"/>
            <path d="M16 78c0-16 12.5-28 28-28s28 12 28 28" fill="#141413"/>
          </svg>
          <span id="face-check" style="display:none;font-size:40px;color:var(--ink);">✓</span>
          <div class="face-scan-line" id="scan-line"></div>
        </div>
      </div>

      <div class="face-tips" id="face-tips">
        <div class="face-tip">
          <div class="face-tip-icon">📱</div>
          <p class="face-tip-label">Face the<br>camera directly</p>
        </div>
        <div class="face-tip">
          <div class="face-tip-icon">☀️</div>
          <p class="face-tip-label">Ensure good<br>lighting</p>
        </div>
        <div class="face-tip">
          <div class="face-tip-icon">🙂</div>
          <p class="face-tip-label">No face<br>coverings</p>
        </div>
      </div>
    </div>

    <div class="face-auth-footer">
      <p class="face-auth-status" id="liveness-status"></p>
      <button class="btn btn-primary" id="btn-scan">Start liveness check</button>
      <button class="btn btn-primary" id="btn-next" style="display:none;">Continue</button>
      <div id="kyc-privacy-note"></div>    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (!AppState.requireAuth()) throw '';
    document.getElementById('step-label').innerHTML = Auth.stepLabel(3);
    document.getElementById('progress-bar').innerHTML = Auth.progressBar('liveness');
    Auth.initKycHints();
    Auth.bindKycExitRetain({
      step: 'liveness',
      mode: 'benefit',
      exitTo: 'home.html',
      backBtn: '#btn-back'
    });
    const scanCircle = document.getElementById('scan-circle');
    const btnScan = document.getElementById('btn-scan');
    const btnNext = document.getElementById('btn-next');
    const status = document.getElementById('liveness-status');

    btnScan.addEventListener('click', () => {
      btnScan.disabled = true;
      scanCircle.classList.add('scanning');
      status.textContent = 'Running liveness check…';

      setTimeout(() => { status.textContent = 'Please follow the on-screen prompts'; }, 1200);

      setTimeout(() => {
        scanCircle.classList.remove('scanning');
        scanCircle.classList.add('success');
        document.getElementById('face-silhouette').style.display = 'none';
        document.getElementById('face-check').style.display = 'block';
        status.textContent = 'Liveness verified';
        status.classList.add('success');
        btnScan.style.display = 'none';
        btnNext.style.display = 'block';
      }, 2800);
    });

    btnNext.addEventListener('click', () => {
      AppState.set(AppState.KEYS.kycStep, 'contact');
      AppState.go('kyc-contact.html');
    });
  </script>
</body>
</html>
