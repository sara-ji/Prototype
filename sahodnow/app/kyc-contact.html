<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SahodNow — Contact Information</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell no-nav">
    <div class="page-header">
      <button class="back-btn" id="btn-back" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#141413" stroke-width="1.5" fill="none"/></svg>
      </button>
      <div>
        <div id="step-label"></div>
        <h2>Contact information</h2>
      </div>
    </div>

    <div class="page-content">
      <div id="progress-bar"></div>
      <p class="text-muted" style="margin-bottom:24px;">
        Provide an emergency or reference contact we may reach if needed.
      </p>

      <div class="contact-card" data-ref="1">
        <p class="contact-card-title">Contact reference 1</p>
        <div class="form-group">
          <label class="form-label">Name</label>
          <input class="form-input ref-name" placeholder="Full name">
          <p class="form-error ref-name-error"></p>
        </div>
        <div class="form-group">
          <label class="form-label">Phone number</label>
          <div style="display:flex;gap:8px;">
            <input class="form-input" style="width:72px;flex-shrink:0;text-align:center;" value="+63" readonly>
            <input class="form-input ref-phone" type="tel" placeholder="9XX XXX XXXX" inputmode="numeric" maxlength="12">
          </div>
          <p class="form-error ref-phone-error"></p>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Relationship</label>
          <input type="hidden" class="ref-relationship" id="ref1-relationship" value="">
          <button type="button" class="form-picker-trigger" data-kyc-select="refRelationship" data-kyc-select-for="ref1-relationship" aria-haspopup="dialog">
            <span class="form-picker-trigger__text text-muted">Select</span>
            <span class="chevron" aria-hidden="true">›</span>
          </button>
        </div>
      </div>

      <!-- Contact reference 2 — hidden for now
      <div class="contact-card" data-ref="2">

        <div class="form-group">

          <input class="form-input ref-name" placeholder="Full name">

          </div>
          <p class="form-error ref-phone-error"></p>
        </div>

        </div>
      </div>

      <div class="contact-card" data-ref="3">
        <p class="contact-card-title">Contact reference 3</p>
        <div class="form-group">
          <label class="form-label">Name</label>
          <input class="form-input ref-name" placeholder="Full name">
          <p class="form-error ref-name-error"></p>

        <div class="form-group">

      <button class="btn btn-primary" id="btn-submit" disabled>Submit</button>
      <div id="kyc-privacy-note"></div>    </div>
  </div>

  <div class="overlay" id="kyc-select-overlay">
    <div class="sheet sheet-half">
      <div class="sheet-handle"></div>
      <h3 class="id-more-sheet-title" data-select-title>Select</h3>
      <div class="kyc-select-list" data-select-list role="listbox"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (!AppState.requireAuth()) throw '';
    document.getElementById('step-label').innerHTML = Auth.stepLabel(4);
    document.getElementById('progress-bar').innerHTML = Auth.progressBar('contact');
    Auth.initKycHints();
    Auth.bindKycExitRetain({
      step: 'contact',
      mode: 'benefit',
      exitTo: 'home.html',
      backBtn: '#btn-back'
    });
    Auth.bindKycSelectSheets({
      fields: {
        refRelationship: {
          title: 'Relationship',
          options: [
            'Spouse',
            'Parent',
            'Child',
            'Brother',
            'Sister',
            'Relative',
            'Colleague',
            'Friend',
            'Other'
          ]
        }
      }
    });
    const cards = document.querySelectorAll('.contact-card');

    function normalizeName(name) {
      return name.trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function getAccountPhone() {
      const user = AppState.getUser();
      if (!user?.phone) return '';
      const digits = String(user.phone).replace(/\D/g, '');
      if (digits.length >= 10) return digits.slice(-10);
      return digits;
    }

    function setFieldError(errEl, show, msg) {
      errEl.textContent = msg;
      errEl.classList.toggle('show', show);
    }

    function getContacts() {
      return Array.from(cards).map(card => ({
        card,
        name: card.querySelector('.ref-name').value.trim(),
        nameNorm: normalizeName(card.querySelector('.ref-name').value),
        phone: card.querySelector('.ref-phone').value.replace(/\D/g, ''),
        rel: card.querySelector('.ref-relationship').value
      }));
    }

    function validateName(contact, index, contacts) {
      const errEl = contact.card.querySelector('.ref-name-error');
      if (!contact.name) {
        setFieldError(errEl, false, '');
        return false;
      }
      const duplicate = contacts.some((c, i) => i !== index && c.nameNorm && c.nameNorm === contact.nameNorm);
      if (duplicate) {
        setFieldError(errEl, true, 'This name is already used for another contact');
        return false;
      }
      setFieldError(errEl, false, '');
      return true;
    }

    function validatePhone(contact, index, contacts) {
      const errEl = contact.card.querySelector('.ref-phone-error');
      const raw = contact.card.querySelector('.ref-phone').value;
      if (!contact.phone) {
        setFieldError(errEl, false, '');
        return false;
      }
      const v = Auth.validatePhone(raw);
      if (!v.ok) {
        setFieldError(errEl, true, v.msg);
        return false;
      }
      const accountPhone = getAccountPhone();
      if (accountPhone && v.phone === accountPhone) {
        setFieldError(errEl, true, 'Contact number cannot be the same as your phone number');
        return false;
      }
      const duplicate = contacts.some((c, i) => i !== index && c.phone.length === 10 && c.phone === v.phone);
      if (duplicate) {
        setFieldError(errEl, true, 'This phone number is already used for another contact');
        return false;
      }
      setFieldError(errEl, false, '');
      return true;
    }

    function validateCard(contact, index, contacts) {
      const nameOk = validateName(contact, index, contacts);
      const phoneOk = validatePhone(contact, index, contacts);
      return nameOk && phoneOk && contact.rel;
    }

    function validateAll() {
      const contacts = getContacts();
      const allOk = contacts.every((contact, index) => validateCard(contact, index, contacts));
      document.getElementById('btn-submit').disabled = !allOk;
    }

    function formatPhoneInput(input) {
      input.addEventListener('input', () => {
        const digits = input.value.replace(/\D/g, '').slice(0, 10);
        input.value = Auth.formatDisplay(digits);
        validateAll();
      });
    }

    cards.forEach(card => {
      card.querySelector('.ref-name').addEventListener('input', validateAll);
      card.querySelector('.ref-relationship').addEventListener('change', validateAll);
      formatPhoneInput(card.querySelector('.ref-phone'));
    });

    document.getElementById('btn-submit').addEventListener('click', () => {
      AppState.set(AppState.KEYS.kycStep, 'enhance');
      AppState.go('kyc-enhance.html');
    });
  </script>
</body>
</html>
