<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SahodNow — Verify Identity</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell no-nav">
    <div class="page-header">
      <button class="back-btn" id="btn-back" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#141413" stroke-width="1.5" fill="none"/></svg>
      </button>
      <div>
        <h2>Verify your identity</h2>
      </div>
    </div>

    <div class="page-content face-auth-layout">
      <p class="text-muted" style="font-size:14px;margin-bottom:16px;">
        Adding a new payout account requires a quick face check to protect your account.
      </p>

      <div class="face-security-badge">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1.5L2.5 4v4c0 3.5 2.3 6.8 5.5 7.8 3.2-1 5.5-4.3 5.5-7.8V4L8 1.5z" stroke="#696969" stroke-width="1.2" fill="none"/>
          <path d="M6 8l1.5 1.5L10.5 6.5" stroke="#696969" stroke-width="1.2"/>
        </svg>
        <span>Face match against your KYC photo</span>
      </div>

      <div class="face-scan-zone">
        <div class="face-scan-circle" id="scan-circle">
          <svg class="face-silhouette" viewBox="0 0 88 88" fill="none">
            <circle cx="44" cy="32" r="16" fill="#141413"/>
            <path d="M16 78c0-16 12.5-28 28-28s28 12 28 28" fill="#141413"/>
          </svg>
          <span id="face-check" style="display:none;font-size:40px;color:var(--ink);">✓</span>
          <div class="face-scan-line" id="scan-line"></div>
        </div>
      </div>
    </div>

    <div class="face-auth-footer">
      <p class="face-auth-status" id="liveness-status"></p>
      <button class="btn btn-primary" id="btn-scan">Start face verification</button>
      <button class="btn btn-primary" id="btn-done" style="display:none;">Continue to add account</button>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    if (!AppState.requireAuth()) throw '';

    const params = new URLSearchParams(location.search);
    const from = params.get('from') || 'home';
    const dest = params.get('dest') || from;

    if (!AppState.needsPayoutLivenessForAdd()) {
      AppState.go(`payout-bind.html?from=${encodeURIComponent(from)}&dest=${encodeURIComponent(dest)}`);
      throw '';
    }

    document.getElementById('btn-back').addEventListener('click', () => {
      if (from === 'payout-accounts') {
        AppState.go(`payout-accounts.html?from=${encodeURIComponent(dest)}`);
      } else if (AppState.isPayoutBound()) {
        AppState.goPayoutManage(dest);
      } else {
        AppState.go('home.html');
      }
    });

    const scanCircle = document.getElementById('scan-circle');
    const btnScan = document.getElementById('btn-scan');
    const btnDone = document.getElementById('btn-done');
    const status = document.getElementById('liveness-status');

    btnScan.addEventListener('click', () => {
      btnScan.disabled = true;
      scanCircle.classList.add('scanning');
      status.textContent = 'Matching your face…';
      setTimeout(() => {
        scanCircle.classList.remove('scanning');
        scanCircle.classList.add('success');
        document.querySelector('.face-silhouette').style.display = 'none';
        document.getElementById('face-check').style.display = 'block';
        status.textContent = 'Face verified';
        status.classList.add('success');
        btnScan.style.display = 'none';
        btnDone.style.display = 'block';
      }, 2200);
    });

    btnDone.addEventListener('click', () => {
      AppState.setPayoutAddVerified(true);
      AppState.go(`payout-bind.html?from=${encodeURIComponent(from)}&dest=${encodeURIComponent(dest)}`);
    });
  </script>
</body>
</html>
