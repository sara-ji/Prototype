<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SahodNow — Statement history</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell no-nav">
    <div class="page-header">
      <button class="back-btn" onclick="AppState.go('bill.html')" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#141413" stroke-width="1.5" fill="none"/></svg>
      </button>
      <div>
        <h2>Statement history</h2>
      </div>
    </div>

    <div class="page-content" style="padding-top:8px;">
      <div id="history-list"></div>
      <div id="history-empty" style="display:none;text-align:center;padding:36px 0;">
        <p style="font-size:44px;margin-bottom:12px;">🧾</p>
        <h3 style="margin-bottom:8px;">No statements yet</h3>
        <p class="text-muted">Paid monthly bills will appear here.</p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (!AppState.requireApproved()) throw '';

    const listEl = document.getElementById('history-list');
    const emptyEl = document.getElementById('history-empty');
    const statements = AppState.getStatementHistory();

    function formatMonthLabel(st) {
      if (st.monthKey && /^\d{4}-\d{2}$/.test(st.monthKey)) {
        const [y, m] = st.monthKey.split('-');
        return `${m}/${y}`;
      }
      return st.dueLabel || st.title || '—';
    }

    function renderLine(line) {
      const inst = String(line.instText || '').startsWith('Term')
        ? line.instText
        : (line.instText ? `Term ${String(line.instText).replace('/', ' of ')}` : '');
      return `
        <div class="bill-history-row" role="button" tabindex="0"
          onclick="AppState.go('loan-detail.html?id=${encodeURIComponent(line.loanId)}&from=bill-history')"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();AppState.go('loan-detail.html?id=${encodeURIComponent(line.loanId)}&from=bill-history')}">
          <div class="bill-history-row-main">
            <strong>${line.name || 'Installment loan'}</strong>
            <span class="text-muted">${inst}</span>
          </div>
          <div class="bill-history-row-side">
            <span class="bill-history-amt">${AppState.formatPHP(line.amount)}</span>
            <span class="status paid">${line.status || 'Paid'}</span>
          </div>
        </div>`;
    }

    if (!statements.length) {
      emptyEl.style.display = 'block';
    } else {
      emptyEl.style.display = 'none';
      listEl.innerHTML = statements.map(st => `
        <section class="bill-history-group">
          <div class="bill-history-group__head">
            <span class="bill-history-group__month"><span class="dot">•</span> ${formatMonthLabel(st)}</span>
            <span class="bill-history-group__total">Total ${AppState.formatPHP(st.total)}</span>
          </div>
          <div class="bill-history-group__body">
            ${(st.lines || []).map(renderLine).join('')}
          </div>
        </section>
      `).join('');
    }
  </script>
</body>
</html>
