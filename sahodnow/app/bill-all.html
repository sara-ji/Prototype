<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SahodNow — Installment loans</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell no-nav">
    <div class="page-header">
      <button class="back-btn" id="btn-back" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#141413" stroke-width="1.5" fill="none"/></svg>
      </button>
      <div>
        <h2>Installment loans</h2>
      </div>
    </div>

    <div class="page-content" style="padding-top:8px;">
      <div id="bill-all-main"></div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    if (!AppState.requireApproved()) throw '';
    AppState.bootstrapDemoSession();

    const isOverdueView = new URLSearchParams(location.search).get('state') === 'overdue';
    const billHomeHref = `bill.html${isOverdueView ? '?state=overdue' : ''}`;
    const refDate = isOverdueView ? AppState.getBillReferenceDate() : new Date();
    document.getElementById('btn-back').addEventListener('click', () => AppState.go(billHomeHref));

    const mainEl = document.getElementById('bill-all-main');
    const loans = AppState.getLoans();
    const active = loans.filter(l => l.status === 'active');
    const settled = loans.filter(l => l.status === 'settled');

    function loanOverdueDays(loan) {
      const schedule = AppState.getLoanSchedule(loan);
      const next = schedule.find(r => !r.paid);
      if (!next) return 0;
      const today = new Date(refDate);
      today.setHours(0, 0, 0, 0);
      const due = new Date(next.dueDate);
      due.setHours(0, 0, 0, 0);
      return today > due ? Math.floor((today - due) / 86400000) : 0;
    }

    if (!loans.length) {
      mainEl.innerHTML = `
        <div style="text-align:center;padding:48px 0;">
          <p style="font-size:48px;margin-bottom:16px;">📋</p>
          <h3 style="margin-bottom:8px;">No loans yet</h3>
          <p class="text-muted">Your installment loans will appear here.</p>
          <button class="btn btn-secondary" style="margin-top:24px;" onclick="AppState.go('bill.html')">Back</button>
        </div>`;
    } else {
      mainEl.innerHTML = `
        <div class="tab-bar" role="tablist" aria-label="Loan orders">
          <button type="button" class="tab-item active" id="tab-active" role="tab" aria-selected="true">In progress</button>
          <button type="button" class="tab-item" id="tab-settled" role="tab" aria-selected="false">Completed</button>
        </div>
        <div id="loan-list" class="bill-order-list"></div>
        <div id="loan-empty" style="display:none;text-align:center;padding:24px 0;">
          <p class="text-muted" style="margin:0;">No records.</p>
        </div>`;

      const listEl = document.getElementById('loan-list');
      const emptyEl = document.getElementById('loan-empty');

      function rowActive(l) {
        const remain = AppState.getLoanRemainingPeriods(l);
        const days = loanOverdueDays(l);
        return AppState.renderBillLoanRow({
          loanId: l.id,
          principal: l.principal,
          appliedAt: l.appliedAt,
          disbursedAt: l.disbursedAt,
          termMonths: l.termMonths,
          remainingPeriods: remain,
          amount: l.principal
        }, {
          variant: 'list',
          from: 'bill-all',
          overdueDays: days
        });
      }

      function render(which) {
        const arr = which === 'settled' ? settled : active;
        document.getElementById('tab-active').classList.toggle('active', which === 'active');
        document.getElementById('tab-settled').classList.toggle('active', which === 'settled');
        document.getElementById('tab-active').setAttribute('aria-selected', which === 'active' ? 'true' : 'false');
        document.getElementById('tab-settled').setAttribute('aria-selected', which === 'settled' ? 'true' : 'false');

        if (!arr.length) {
          listEl.innerHTML = '';
          emptyEl.style.display = 'block';
          return;
        }
        emptyEl.style.display = 'none';
        listEl.innerHTML = arr
          .sort((a, b) => (b.appliedAt || 0) - (a.appliedAt || 0))
          .map(l => (which === 'settled'
            ? AppState.renderBillLoanRow({
                loanId: l.id,
                principal: l.principal,
                appliedAt: l.appliedAt,
                disbursedAt: l.disbursedAt,
                termMonths: l.termMonths,
                remainingPeriods: 0,
                amount: l.principal
              }, {
                variant: 'list',
                from: 'bill-all',
                statusText: 'Completed',
                statusClass: 'paid'
              })
            : rowActive(l)))
          .join('');
      }

      document.getElementById('tab-active').addEventListener('click', () => render('active'));
      document.getElementById('tab-settled').addEventListener('click', () => render('settled'));
      render('active');
    }
  </script>
</body>
</html>
