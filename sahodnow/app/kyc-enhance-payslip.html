<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SahodNow — Payslip</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell no-nav">
    <div class="page-header">
      <button class="back-btn" id="btn-back" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#141413" stroke-width="1.5" fill="none"/></svg>
      </button>
      <div>
        <h2>Payslip</h2>
        <p class="page-header-sub">PDF only</p>
      </div>
    </div>

    <div class="page-content enhance-detail">
      <div class="upload-zone" id="payslip-upload">
        <p style="font-size:24px;margin-bottom:4px;">💰</p>
        <p style="font-size:14px;">Upload payslip (PDF)</p>
        <p class="text-muted" style="font-size:12px;margin-top:4px;">PDF files only</p>
      </div>
      <input type="file" accept="application/pdf,.pdf" hidden id="payslip-file">

      <div class="enhance-detail-footer">
        <button type="button" class="btn btn-primary" id="btn-save" disabled>Save</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (!AppState.requireAuth()) throw '';

    const KEY = 'payslip';
    const saved = AppState.getEnhanceItems()[KEY] || {};
    let fileName = saved.fileName || '';

    document.getElementById('btn-back').addEventListener('click', () => AppState.go('kyc-enhance.html'));

    function isPdf(file) {
      const name = (file.name || '').toLowerCase();
      return file.type === 'application/pdf' || name.endsWith('.pdf');
    }

    function setDoneUI(name) {
      const zone = document.getElementById('payslip-upload');
      zone.classList.add('done');
      zone.innerHTML = `<p style="font-size:28px;">✓</p>
        <p style="font-size:14px;">Uploaded</p>
        <p class="text-muted" style="font-size:12px;margin-top:4px;">${name || 'document.pdf'}</p>`;
      document.getElementById('btn-save').disabled = false;
    }

    document.getElementById('payslip-upload').addEventListener('click', () => {
      document.getElementById('payslip-file').click();
    });

    document.getElementById('payslip-file').addEventListener('change', () => {
      const file = document.getElementById('payslip-file').files?.[0];
      if (!file) return;
      if (!isPdf(file)) {
        const zone = document.getElementById('payslip-upload');
        zone.classList.remove('done');
        zone.innerHTML = `<p style="font-size:24px;margin-bottom:4px;">💰</p>
          <p style="font-size:14px;">Upload PDF only</p>
          <p class="form-error show" style="display:block;margin-top:8px;">Please upload a PDF file.</p>`;
        fileName = '';
        document.getElementById('btn-save').disabled = true;
      } else {
        fileName = file.name;
        setDoneUI(fileName);
      }
      document.getElementById('payslip-file').value = '';
    });

    document.getElementById('btn-save').addEventListener('click', () => {
      if (!fileName) return;
      AppState.setEnhanceItem(KEY, { done: true, fileName });
      AppState.go('kyc-enhance.html');
    });

    if (saved.done && saved.fileName) setDoneUI(saved.fileName);
  </script>
</body>
</html>
