<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SahodNow — Loan details</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell no-nav">
    <div class="page-header">
      <button class="back-btn" id="btn-back" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#141413" stroke-width="1.5" fill="none"/></svg>
      </button>
      <div>
        <h2>Loan details</h2>
      </div>
    </div>

    <div class="page-content" style="padding-top:8px;">
      <div class="card loan-detail-card" style="margin-bottom:16px;">
        <div class="plan-row">
          <span class="text-muted">Order no.</span>
          <span style="font-weight:500;" id="loan-id">—</span>
        </div>
        <div class="plan-row">
          <span class="text-muted">Disbursement date</span>
          <span style="font-weight:500;" id="loan-disbursed">—</span>
        </div>
        <div class="plan-row">
          <span class="text-muted">Principal</span>
          <span style="font-weight:500;" id="loan-principal">—</span>
        </div>
        <div class="plan-row">
          <span class="text-muted">Installments</span>
          <span style="font-weight:500;" id="loan-installments">—</span>
        </div>
        <div class="plan-row">
          <span class="text-muted">Disbursement account</span>
          <span style="font-weight:500;" id="loan-payout">—</span>
        </div>
        <div class="plan-row" id="row-outstanding">
          <span class="text-muted" id="loan-balance-label">Total outstanding</span>
          <span style="font-weight:500;" id="loan-outstanding">—</span>
        </div>
        <div class="plan-row">
          <span class="text-muted">Status</span>
          <span style="font-weight:500;" id="loan-status">—</span>
        </div>
        <div class="plan-row" id="row-settled" style="display:none;">
          <span class="text-muted">Settlement date</span>
          <span style="font-weight:500;" id="loan-settled">—</span>
        </div>
      </div>

      <div class="card loan-detail-card" style="margin-bottom:16px;">
        <div class="loan-schedule-head">
          <p class="loan-schedule-title">Repayment schedule</p>
          <p class="text-muted loan-schedule-due" id="schedule-caption">· due 20th</p>
        </div>
        <div id="schedule-list"></div>
      </div>

      <button type="button" class="btn btn-primary" id="btn-settle" style="display:none;">Early payoff</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (!AppState.requireApproved()) throw '';

    const params = new URLSearchParams(location.search);
    const id = params.get('id') || '';
    const from = params.get('from') || 'bill';
    const isOverdueView = params.get('state') === 'overdue';
    const backMap = {
      'bill-current': `bill-current.html${isOverdueView ? '?state=overdue' : ''}`,
      'bill-all': `bill-all.html${isOverdueView ? '?state=overdue' : ''}`,
      'bill-all-due': `bill-all-due.html${isOverdueView ? '?state=overdue' : ''}`,
      'bill-history': 'bill-history.html',
      bill: `bill.html${isOverdueView ? '?state=overdue' : ''}`
    };
    document.getElementById('btn-back').addEventListener('click', () => {
      AppState.go(backMap[from] || 'bill.html');
    });

    const loan = AppState.getLoanById(id);
    if (!loan) {
      alert('Loan not found.');
      AppState.go('bill.html');
      throw '';
    }

    const schedule = AppState.getLoanSchedule(loan);
    const isClosed = loan.status === 'settled';
    const refDate = isOverdueView ? AppState.getBillReferenceDate() : new Date();

    document.getElementById('loan-id').textContent = loan.id;
    document.getElementById('loan-disbursed').textContent = AppState.formatDate(loan.disbursedAt);
    document.getElementById('loan-principal').textContent = AppState.formatPHP(loan.principal);
    document.getElementById('loan-installments').textContent = String(loan.termMonths || schedule.length || '—');
    document.getElementById('loan-payout').textContent = loan.payoutDisplay;

    if (isClosed) {
      const repaid = schedule.reduce((s, r) => s + (Number(r.amount) || Number(r.payment) || 0), 0);
      document.getElementById('loan-balance-label').textContent = 'Repayment amount';
      document.getElementById('loan-outstanding').textContent = AppState.formatPHP(repaid || loan.principal);
      document.getElementById('loan-status').textContent = 'Settled';
      document.getElementById('row-settled').style.display = 'flex';
      document.getElementById('loan-settled').textContent = AppState.formatDate(loan.settledAt || loan.disbursedAt);
    } else {
      document.getElementById('loan-outstanding').textContent = AppState.formatPHP(AppState.getLoanRemainingAmount(loan));
      document.getElementById('loan-status').textContent = 'Active';
    }

    document.getElementById('schedule-caption').textContent = '· due 20th';

    const currentPeriod = isClosed ? null : AppState.getLoanCurrentPeriod(loan);
    let overduePeriod = null;
    if (!isClosed) {
      const next = schedule.find(r => !r.paid);
      if (next) {
        const today = new Date(refDate);
        today.setHours(0, 0, 0, 0);
        const due = new Date(next.dueDate);
        due.setHours(0, 0, 0, 0);
        if (today > due) {
          overduePeriod = next.period;
          const days = Math.max(1, Math.floor((today - due) / 86400000));
          const pen = AppState.computeBillPenalty(next.amount || next.payment || 0, days, loan.principal);
          next.penalty = pen.penaltyAccrued;
        }
      }
    }

    document.getElementById('schedule-list').innerHTML = AppState.renderRepayTimeline(schedule, {
      currentPeriod: overduePeriod != null ? null : currentPeriod,
      overduePeriod,
      allPaid: isClosed
    });

    if (loan.status === 'active' && AppState.getLoanRemainingPeriods(loan) > 0) {
      document.getElementById('btn-settle').style.display = 'block';
    }

    document.getElementById('btn-settle').addEventListener('click', () => {
      if (!confirm('Pay off this loan early?')) return;
      AppState.settleLoan(loan.id);
      alert('Loan settled.');
      location.reload();
    });
  </script>
</body>
</html>
