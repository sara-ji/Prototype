<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SahodNow — Reset PIN</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell no-nav">
    <div class="page-header">
      <button class="back-btn" id="btn-back" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="#141413" stroke-width="1.5" fill="none"/></svg>
      </button>
      <h2>Reset PIN</h2>
    </div>

    <div class="page-content">
      <p class="text-muted" style="margin-bottom:8px;" id="reset-lead">Create a new PIN for</p>
      <p style="font-weight:500;font-size:18px;margin:0 0 28px;" id="reset-phone-display">+63 917 123 4567</p>

      <div class="form-group">
        <label class="form-label">New PIN</label>
        <div class="otp-group" id="pin-group">
          <input class="otp-input" type="password" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password" aria-label="PIN digit 1">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="PIN digit 2">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="PIN digit 3">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="PIN digit 4">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="PIN digit 5">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="PIN digit 6">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm new PIN</label>
        <div class="otp-group" id="pin-confirm-group">
          <input class="otp-input" type="password" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password" aria-label="Confirm PIN digit 1">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Confirm PIN digit 2">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Confirm PIN digit 3">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Confirm PIN digit 4">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Confirm PIN digit 5">
          <input class="otp-input" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Confirm PIN digit 6">
        </div>
      </div>

      <p class="form-error" id="pin-error" style="text-align:center;"></p>

      <ul style="font-size:13px;color:var(--muted);margin:16px 0 32px;padding-left:20px;line-height:1.8;">
        <li id="rule-len">6 digits</li>
        <li id="rule-match">PINs match</li>
      </ul>

      <button class="btn btn-primary" id="btn-submit" disabled>Save new PIN</button>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const isPreview = params.get('prototype') === '1';
    const phone = (params.get('phone') || Auth.DEMO_REGISTERED).replace(/\D/g, '');
    const activePhone = phone.length === 10 ? phone : Auth.DEMO_REGISTERED;

    if (!isPreview) {
      if (!AppState.isPrivacyAccepted()) AppState.go('index.html');
      if (!phone || phone.length !== 10) {
        AppState.go('login.html');
        throw '';
      }
      if (!Auth.isPinResetVerified(phone)) {
        AppState.go('otp.html?phone=' + encodeURIComponent(phone) + '&flow=reset-pin');
        throw '';
      }
    }

    document.getElementById('reset-phone-display').textContent = '+63 ' + Auth.formatDisplay(activePhone);

    document.getElementById('btn-back').addEventListener('click', () => {
      if (isPreview) {
        AppState.go('pin-login.html');
        return;
      }
      if (params.get('return') === 'settings') {
        Auth.clearPinResetVerified();
        AppState.go('settings.html');
        return;
      }
      Auth.clearPinResetVerified();
      AppState.go('pin-login.html?phone=' + encodeURIComponent(activePhone));
    });

    const pinError = document.getElementById('pin-error');
    const btn = document.getElementById('btn-submit');
    const ruleLen = document.getElementById('rule-len');
    const ruleMatch = document.getElementById('rule-match');

    const getPin = Auth.bindOtpInputs(document.getElementById('pin-group'), validate);
    const getPinConfirm = Auth.bindOtpInputs(document.getElementById('pin-confirm-group'), validate);

    function validate() {
      const pin = getPin();
      const confirm = getPinConfirm();
      const lenOk = pin.length === 6;
      const matchOk = lenOk && confirm.length === 6 && pin === confirm;

      ruleLen.style.color = lenOk ? '#2E7D32' : '';
      ruleMatch.style.color = matchOk ? '#2E7D32' : (confirm.length === 6 && pin !== confirm ? '' : '');

      if (confirm.length === 6 && pin !== confirm) {
        pinError.textContent = 'PINs do not match. Please try again.';
        pinError.classList.add('show');
      } else {
        pinError.textContent = '';
        pinError.classList.remove('show');
      }

      btn.disabled = !matchOk;
    }

    btn.addEventListener('click', () => {
      const pin = getPin();
      btn.disabled = true;
      btn.textContent = 'Please wait…';

      if (isPreview) {
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = 'Save new PIN';
        }, 600);
        return;
      }

      Auth.setDevicePin(activePhone, pin);
      Auth.markRegistered(activePhone);
      Auth.clearPinResetVerified();
      if (params.get('return') === 'settings') {
        AppState.go('settings.html');
        return;
      }
      AppState.login({ phone: '+63' + activePhone, name: 'Juan Dela Cruz' });
      Auth.routeAfterLogin();
    });

    document.getElementById('pin-group').querySelector('.otp-input').focus();
  </script>
</body>
</html>
