<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype Gallery</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1a1a1a;
      --muted: #6b6560;
      --card: #ffffff;
      --line: #e8e2d9;
      --accent: #e8612d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; }
    .sub { color: var(--muted); margin: 0 0 32px; }
    section { margin-bottom: 28px; }
    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    a.item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }
    a.item:last-child { border-bottom: none; }
    a.item:hover { background: #fbf8f3; }
    a.item strong { font-weight: 600; }
    a.item span { color: var(--muted); font-size: 13px; }
    .tag {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--accent);
      border: 1px solid #f0c4b0;
      background: #fff4ef;
      border-radius: 999px;
      padding: 2px 10px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Prototype Gallery</h1>
    <p class="sub">点击下方链接即可在浏览器中预览原型。把本页地址发给同事即可。</p>

    <section>
      <h2>SahodNow</h2>
      <div class="card">
        <a class="item" href="sahodnow/app/index.html">
          <div>
            <strong>APP 原型</strong>
            <div><span>sahodnow/app/</span></div>
          </div>
          <span class="tag">Open</span>
        </a>
        <a class="item" href="sahodnow/website/index.html">
          <div>
            <strong>官网原型</strong>
            <div><span>sahodnow/website/</span></div>
          </div>
          <span class="tag">Open</span>
        </a>
        <a class="item" href="sahodnow/backend.html">
          <div>
            <strong>Backend 原型</strong>
            <div><span>sahodnow/backend.html</span></div>
          </div>
          <span class="tag">Open</span>
        </a>
      </div>
    </section>

    <section>
      <h2>OFW / KidlatPeso</h2>
      <div class="card">
        <a class="item" href="ofw/kidlatpeso-v3-0818.html">
          <div>
            <strong>KidlatPeso V3 APP</strong>
            <div><span>ofw/kidlatpeso-v3-0818.html</span></div>
          </div>
          <span class="tag">Open</span>
        </a>
        <a class="item" href="ofw/kidlatpeso-admin-0814.html">
          <div>
            <strong>KidlatPeso Admin</strong>
            <div><span>ofw/kidlatpeso-admin-0814.html</span></div>
          </div>
          <span class="tag">Open</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
